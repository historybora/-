<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>환율 보드게임 (교실용)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f0f4f8; overflow: hidden; }
        
        /* 팝업 효과 */
        .pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 말 이동 부드럽게 */
        .token-transition { transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

        /* --- 3D 주사위 스타일 (수정됨) --- */
        .scene { width: 200px; height: 200px; perspective: 600px; display: flex; justify-content: center; align-items: center; }
        .cube { width: 120px; height: 120px; position: relative; transform-style: preserve-3d; transform: translateZ(-60px); transition: transform 1s; }
        .cube.rolling { animation: spinDice 0.6s infinite linear; }
        
        .cube__face {
            position: absolute; width: 120px; height: 120px;
            border: 4px solid #e5e7eb; background: white; border-radius: 20px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }

        /* 면 위치 */
        .cube__face--1  { transform: rotateY(  0deg) translateZ(60px); }
        .cube__face--2  { transform: rotateY( 90deg) translateZ(60px); }
        .cube__face--3  { transform: rotateY(180deg) translateZ(60px); }
        .cube__face--4  { transform: rotateY(-90deg) translateZ(60px); }
        .cube__face--5  { transform: rotateX( 90deg) translateZ(60px); }
        .cube__face--6  { transform: rotateX(-90deg) translateZ(60px); }

        /* 회전 결과 */
        .show-1 { transform: translateZ(-60px) rotateY(   0deg); }
        .show-2 { transform: translateZ(-60px) rotateY( -90deg); }
        .show-3 { transform: translateZ(-60px) rotateY(-180deg); }
        .show-4 { transform: translateZ(-60px) rotateY(  90deg); }
        .show-5 { transform: translateZ(-60px) rotateX( -90deg); }
        .show-6 { transform: translateZ(-60px) rotateX(  90deg); }

        @keyframes spinDice {
            0% { transform: translateZ(-60px) rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: translateZ(-60px) rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
        }

        .dot { width: 22px; height: 22px; background: #333; border-radius: 50%; box-shadow: inset 1px 1px 2px rgba(0,0,0,0.5); }
        
        /* 주사위 점 배치 정밀 수정 */
        .face-1 { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; }
        
        .face-2 { display: flex; justify-content: space-between; padding: 20px; width: 100%; height: 100%; }
        .face-2 .dot:nth-child(2) { align-self: flex-end; }
        
        .face-3 { display: flex; justify-content: space-between; padding: 20px; width: 100%; height: 100%; }
        .face-3 .dot:nth-child(2) { align-self: center; }
        .face-3 .dot:nth-child(3) { align-self: flex-end; }
        
        .face-4 { display: flex; flex-wrap: wrap; align-content: space-between; justify-content: space-between; padding: 20px; width: 100%; height: 100%; }
        
        /* 5번 면 겹침 수정: 절대 위치 사용 */
        .face-5 { position: relative; width: 100%; height: 100%; }
        .face-5 .dot { position: absolute; }
        .face-5 .dot:nth-child(1) { top: 20px; left: 20px; }
        .face-5 .dot:nth-child(2) { top: 20px; right: 20px; }
        .face-5 .dot:nth-child(3) { top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .face-5 .dot:nth-child(4) { bottom: 20px; left: 20px; }
        .face-5 .dot:nth-child(5) { bottom: 20px; right: 20px; }
        
        .face-6 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 10px; padding: 15px; width: 100%; height: 100%; justify-items: center; align-items: center; }

        /* 단상 애니메이션 */
        .podium-rise { animation: riseUp 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; transform: translateY(100%); opacity: 0; }
        @keyframes riseUp { to { transform: translateY(0); opacity: 1; } }

    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 아이콘 (SVG) ---
        const Icons = {
            Trophy: () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className="w-full h-full"><path fillRule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.007 5.404.433c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.433 2.082-5.006z" clipRule="evenodd" /></svg>,
            Volume2: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>,
            VolumeX: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>,
            Flag: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>,
            Refresh: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        };

        // --- 3D 주사위 ---
        const Dice3D = ({ val, isRolling }) => {
            const diceClass = isRolling ? 'rolling' : `show-${val}`;
            return (
                <div className="scene">
                    <div className={`cube ${diceClass}`}>
                        <div className="cube__face cube__face--1"><div className="face-1"><div className="dot"></div></div></div>
                        <div className="cube__face cube__face--2"><div className="face-2"><div className="dot"></div><div className="dot"></div></div></div>
                        <div className="cube__face cube__face--3"><div className="face-3"><div className="dot"></div><div className="dot"></div><div className="dot"></div></div></div>
                        <div className="cube__face cube__face--4"><div className="face-4"><div className="dot"></div><div className="dot"></div><div className="dot"></div><div className="dot"></div></div></div>
                        <div className="cube__face cube__face--5"><div className="face-5"><div className="dot"></div><div className="dot"></div><div className="dot"></div><div className="dot"></div><div className="dot"></div></div></div>
                        <div className="cube__face cube__face--6"><div className="face-6"><div className="dot"></div><div className="dot"></div><div className="dot"></div><div className="dot"></div><div className="dot"></div><div className="dot"></div></div></div>
                    </div>
                </div>
            );
        };

        // --- 데이터 ---
        const TEAM_CONFIG = [
            { id: 0, name: "1팀", icon: "🐯", color: "bg-red-500", border: "border-red-600", light: "bg-red-100" },
            { id: 1, name: "2팀", icon: "🐰", color: "bg-blue-500", border: "border-blue-600", light: "bg-blue-100" },
            { id: 2, name: "3팀", icon: "🐻", color: "bg-green-500", border: "border-green-600", light: "bg-green-100" },
            { id: 3, name: "4팀", icon: "🦊", color: "bg-yellow-500", border: "border-yellow-600", light: "bg-yellow-100" },
            { id: 4, name: "5팀", icon: "🐧", color: "bg-purple-500", border: "border-purple-600", light: "bg-purple-100" },
            { id: 5, name: "6팀", icon: "🐨", color: "bg-pink-500", border: "border-pink-600", light: "bg-pink-100" },
        ];

        const SOUNDS = {
            roll: 'https://assets.mixkit.co/active_storage/sfx/2577/2577-preview.mp3',
            move: 'https://assets.mixkit.co/active_storage/sfx/2578/2578-preview.mp3',
            correct: 'https://assets.mixkit.co/active_storage/sfx/2579/2579-preview.mp3',
            wrong: 'https://assets.mixkit.co/active_storage/sfx/2580/2580-preview.mp3',
            fanfare: 'https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3', // 빵빠레
        };

        // 논리 검수 완료
        const BOARD_TILES = [
            { id: 0, name: "출발", type: "start", role: "none", icon: "🚩", bg: "bg-green-100" },
            { id: 1, name: "수입 가구점\n(가구 판매)", type: "normal", role: "import", icon: "🛋️", bg: "bg-white" },
            { id: 2, name: "수출 기업\n(자동차)", type: "normal", role: "export", icon: "🚗", bg: "bg-white" },
            { id: 3, name: "방한 외국인\n관광객", type: "normal", role: "export", icon: "📸", bg: "bg-white" },
            { id: 4, name: "해외 여행\n가는 한국인", type: "normal", role: "import", icon: "✈️", bg: "bg-white" },
            { id: 5, name: "유학 중인\n한국 학생", type: "normal", role: "import", icon: "🎓", bg: "bg-white" },
            { id: 6, name: "보너스\n게임", type: "bonus", role: "none", icon: "🎁", bg: "bg-yellow-100" },

            { id: 7, name: "유학 온\n외국 학생", type: "normal", role: "export", icon: "🎒", bg: "bg-white" },
            { id: 8, name: "외국계 기업\n한국인(외화월급)", type: "normal", role: "export", icon: "💼", bg: "bg-white" },
            { id: 9, name: "뒤로 가기", type: "back", role: "none", icon: "🔙", bg: "bg-red-100" },

            { id: 10, name: "무인도", type: "island", role: "none", icon: "🏝️", bg: "bg-gray-200" },
            { id: 11, name: "한국 기업\n외국인(원화월급)", type: "normal", role: "import", icon: "👷", bg: "bg-white" },
            { id: 12, name: "달러 투자\n한국인", type: "normal", role: "export", icon: "💰", bg: "bg-white" },
            { id: 13, name: "원화 투자\n외국인", type: "normal", role: "import", icon: "📉", bg: "bg-white" },
            { id: 14, name: "달러 빚\n갚는 한국인", type: "normal", role: "import", icon: "💸", bg: "bg-white" },
            { id: 15, name: "원화 빚\n갚는 외국인", type: "normal", role: "export", icon: "🏦", bg: "bg-white" },

            { id: 16, name: "특별 휴가", type: "rest", role: "none", icon: "🏖️", bg: "bg-blue-100" },
            { id: 17, name: "기러기\n아빠", type: "normal", role: "import", icon: "👨‍👧‍👦", bg: "bg-white" },
        ];

        const SITUATION_CARDS = [
            { type: "UP", label: "환율 상승 📈\n(원화 약세)", desc: "1달러가 1000원 ➔ 1500원!", color: "text-red-600" },
            { type: "DOWN", label: "환율 하락 📉\n(원화 강세)", desc: "1달러가 1500원 ➔ 1000원!", color: "text-blue-600" },
        ];

        // --- 앱 ---
        const App = () => {
            const [setupMode, setSetupMode] = useState(true);
            const [teamCount, setTeamCount] = useState(2);
            const [teams, setTeams] = useState([]);
            const [currentTurn, setCurrentTurn] = useState(0);
            const [gameState, setGameState] = useState('ready');
            const [diceVal, setDiceVal] = useState(1);
            const [currentCard, setCurrentCard] = useState(null);
            const [feedback, setFeedback] = useState(null);
            const [history, setHistory] = useState(["게임을 시작합니다!"]);
            const [isMuted, setIsMuted] = useState(false);
            const audioRef = useRef(null);

            const playSound = (key) => {
                if (!isMuted && audioRef.current) {
                    audioRef.current.src = SOUNDS[key];
                    audioRef.current.play().catch(() => {});
                }
            };

            const addLog = (msg) => setHistory(prev => [msg, ...prev].slice(0, 1));

            const startGame = () => {
                setTeams(Array.from({ length: teamCount }, (_, i) => ({ ...TEAM_CONFIG[i], position: 0, score: 0, isStuck: false })));
                setSetupMode(false);
            };

            const finishGame = () => {
                setGameState('gameover');
                playSound('fanfare');
            };

            const rollDice = () => {
                if (gameState !== 'ready') return;
                
                if (teams[currentTurn].isStuck) {
                    addLog(`${teams[currentTurn].name}: 무인도에서 휴식 중...`);
                    setTeams(prev => prev.map((t, i) => i === currentTurn ? { ...t, isStuck: false } : t));
                    setTimeout(nextTurn, 1500);
                    return;
                }

                setGameState('rolling');
                playSound('roll');
                
                let count = 0;
                const interval = setInterval(() => {
                    count++;
                    if (count > 25) { 
                        clearInterval(interval);
                        const final = Math.ceil(Math.random() * 6);
                        setDiceVal(final);
                        setGameState('rolled');
                        setTimeout(() => handleMove(final), 1000); 
                    }
                }, 80);
            };

            const handleMove = (steps) => {
                setGameState('moving');
                playSound('move');

                const activeTeam = teams[currentTurn];
                let nextPos = activeTeam.position + steps;
                let looped = false;

                if (nextPos >= BOARD_TILES.length) {
                    nextPos = nextPos % BOARD_TILES.length;
                    looped = true;
                }

                setTeams(prev => prev.map((t, i) => i === currentTurn ? { ...t, position: nextPos } : t));

                setTimeout(() => {
                    if (looped) {
                        addLog(`🎉 출발점 통과! +5점`);
                        updateScore(5);
                        playSound('correct');
                    }

                    const tile = BOARD_TILES[nextPos];
                    if (tile.type === 'back') {
                        addLog("🔙 뒤로 가기 (2칸 후퇴)");
                        let backPos = nextPos - 2;
                        if (backPos < 0) backPos = BOARD_TILES.length + backPos;
                        setTimeout(() => {
                            setTeams(prev => prev.map((t, i) => i === currentTurn ? { ...t, position: backPos } : t));
                            playSound('move');
                            setTimeout(nextTurn, 1000);
                        }, 1000);
                    } else if (tile.type === 'island') {
                        addLog("🏝️ 무인도! 다음 턴 쉽니다.");
                        setTeams(prev => prev.map((t, i) => i === currentTurn ? { ...t, isStuck: true } : t));
                        setTimeout(nextTurn, 1500);
                    } else if (tile.type === 'rest') {
                        addLog("🏖️ 특별 휴가!");
                        setTimeout(nextTurn, 1500);
                    } else if (tile.type === 'bonus') {
                        addLog("🎁 보너스! +2점");
                        updateScore(2);
                        playSound('correct');
                        setTimeout(nextTurn, 1500);
                    } else if (tile.type === 'start') {
                        setTimeout(nextTurn, 1000);
                    } else {
                        setGameState('card');
                        setCurrentCard(SITUATION_CARDS[Math.floor(Math.random() * SITUATION_CARDS.length)]);
                    }
                }, 1000);
            };

            const updateScore = (points) => {
                setTeams(prev => prev.map((t, i) => i === currentTurn ? { ...t, score: t.score + points } : t));
            };

            const checkAnswer = (choice) => {
                const activeTeam = teams[currentTurn];
                const tile = BOARD_TILES[activeTeam.position];
                const card = currentCard;
                let isFavorable = false, explanation = "";

                if (tile.role === 'export') {
                    if (card.type === 'UP') {
                        isFavorable = true; explanation = "환율 상승(원화 약세)! 달러를 원화로 바꿀 때 돈을 더 많이 받아요! 👍";
                    } else {
                        isFavorable = false; explanation = "환율 하락(원화 강세)! 달러를 원화로 바꿀 때 돈이 줄어들어요. 😭";
                    }
                } else if (tile.role === 'import') {
                    if (card.type === 'UP') {
                        isFavorable = false; explanation = "환율 상승! 달러를 살 때 원화를 더 많이 내야 해요. 💸";
                    } else {
                        isFavorable = true; explanation = "환율 하락! 더 적은 원화로 달러를 살 수 있어요! 👍";
                    }
                }

                if ((choice === 'good' && isFavorable) || (choice === 'bad' && !isFavorable)) {
                    setFeedback({ result: "정답! ⭕", msg: "+1점", desc: explanation, isGood: true });
                    updateScore(1);
                    playSound('correct');
                } else {
                    setFeedback({ result: "땡! ❌", msg: "점수 없음", desc: explanation, isGood: false });
                    playSound('wrong');
                }
                setGameState('result');
            };

            const nextTurn = () => {
                setFeedback(null); setCurrentCard(null); setGameState('ready');
                setCurrentTurn(prev => (prev + 1) % teams.length);
            };

            const getGridStyle = (idx) => {
                let col, row;
                if (idx <= 6) { col = idx + 1; row = 1; }
                else if (idx <= 8) { col = 7; row = idx - 5; }
                else if (idx <= 15) { col = 7 - (idx - 9); row = 4; }
                else { col = 1; row = 4 - (idx - 15); }
                return { gridColumn: col, gridRow: row };
            };

            // --- 렌더링 ---
            if (setupMode) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-indigo-900 text-white p-8">
                        <div className="bg-white/10 backdrop-blur-lg p-12 rounded-[3rem] shadow-2xl text-center border border-white/20 max-w-3xl w-full">
                            <h1 className="text-6xl font-black mb-4 text-yellow-400 drop-shadow-lg">환율 보드게임</h1>
                            <p className="text-2xl text-indigo-200 mb-12">교실 대항전 모드</p>
                            <div className="mb-12">
                                <label className="block text-3xl font-bold mb-6">참여 팀 수</label>
                                <div className="flex justify-center gap-6">
                                    {[2, 3, 4, 5, 6].map(num => (
                                        <button key={num} onClick={() => setTeamCount(num)} className={`w-20 h-20 rounded-2xl text-4xl font-bold transition-all ${teamCount === num ? 'bg-yellow-400 text-indigo-900 scale-110 shadow-lg ring-4 ring-yellow-200' : 'bg-indigo-800 hover:bg-indigo-700'}`}>{num}</button>
                                    ))}
                                </div>
                            </div>
                            <button onClick={startGame} className="w-full bg-gradient-to-r from-pink-500 to-orange-500 py-8 rounded-3xl text-4xl font-black shadow-xl hover:scale-105 transition">게임 시작 🚀</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-screen flex flex-col bg-[#e0f7fa] overflow-hidden select-none">
                    <audio ref={audioRef} className="hidden" />

                    {/* 상단바 */}
                    <div className="bg-white shadow-lg p-3 flex justify-between items-center z-10 px-6 h-20">
                        <div className="flex items-center gap-4">
                             <button onClick={finishGame} className="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-xl font-black text-xl shadow-md transition flex items-center gap-2 animate-pulse"><Icons.Flag /> 경기 종료</button>
                             <button onClick={() => setIsMuted(!isMuted)} className="text-slate-400 hover:text-slate-600">{isMuted ? <Icons.VolumeX /> : <Icons.Volume2 />}</button>
                        </div>
                        <div className="flex gap-4 overflow-x-auto items-center">
                            {teams.map((team, idx) => (
                                <div key={idx} className={`flex items-center gap-3 px-4 py-2 rounded-full border-4 transition-all ${idx === currentTurn ? 'bg-yellow-50 border-yellow-400 scale-110 shadow-lg z-10' : 'bg-slate-50 border-slate-200 opacity-70'}`}>
                                    <span className="text-3xl">{team.icon}</span>
                                    <span className="font-bold text-slate-800 text-xl">{team.name}</span>
                                    <span className="bg-slate-800 text-white px-3 py-1 rounded-lg text-xl font-mono">{team.score}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* 보드판 */}
                    <div className="flex-1 p-4 flex items-center justify-center">
                        <div className="w-full h-full max-w-[1600px] grid grid-cols-7 grid-rows-4 gap-2 relative">
                            {/* 중앙 로고 */}
                            <div className="col-start-2 col-end-7 row-start-2 row-end-4 bg-white/60 rounded-[3rem] flex flex-col items-center justify-center border-8 border-dashed border-indigo-200">
                                <h1 className="text-6xl font-black text-indigo-900 tracking-tight mb-4 opacity-30">환율 보드게임</h1>
                                <div className="bg-white/90 px-10 py-4 rounded-full shadow-lg border-2 border-indigo-100 transform scale-125">
                                    <span className="text-3xl font-bold text-slate-800 animate-bounce block">📢 {history[0]}</span>
                                </div>
                            </div>

                            {/* 타일 */}
                            {BOARD_TILES.map((tile, idx) => (
                                <div key={idx} style={getGridStyle(idx)} className={`relative border-4 rounded-3xl flex flex-col items-center justify-center text-center p-2 shadow-md transition-colors ${tile.bg} ${idx === teams[currentTurn].position ? 'border-yellow-500 bg-yellow-50 ring-4 ring-yellow-200 z-10' : 'border-slate-300'}`}>
                                    <div className="text-5xl mb-2">{tile.icon}</div>
                                    <div className="font-bold text-lg md:text-xl text-slate-900 leading-tight break-keep">{tile.name}</div>
                                    {/* 말 */}
                                    <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                        <div className="grid grid-cols-2 gap-1 content-center justify-items-center w-full h-full p-2">
                                            {teams.map((team, tIdx) => team.position === idx && (
                                                <div key={tIdx} className={`w-12 h-12 md:w-16 md:h-16 rounded-full shadow-xl flex items-center justify-center text-3xl md:text-4xl border-4 border-white token-transition ${team.color} z-20`} style={{ transform: tIdx === currentTurn ? 'scale(1.2) translateY(-10px)' : 'scale(1)' }}>{team.icon}</div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* 주사위 버튼 */}
                    <div className="absolute bottom-6 left-1/2 -translate-x-1/2 z-20">
                        {gameState === 'ready' && (
                             <button onClick={rollDice} className={`flex flex-col items-center justify-center w-40 h-40 rounded-full shadow-[0_10px_30px_rgba(0,0,0,0.3)] border-8 border-white transition-transform hover:scale-105 active:scale-95 ${teams[currentTurn].color} animate-bounce`}>
                                <span className="text-6xl mb-2">🎲</span>
                                <span className="text-white font-black text-2xl">GO!</span>
                            </button>
                        )}
                    </div>

                    {/* 오버레이: 주사위 */}
                    {(gameState === 'rolling' || gameState === 'rolled') && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center">
                            <div className="flex flex-col items-center">
                                <div className="text-white text-4xl font-bold mb-16 drop-shadow-lg">{teams[currentTurn].name} 차례!</div>
                                <div className="transform scale-150"><Dice3D val={diceVal} isRolling={gameState === 'rolling'} /></div>
                                {gameState === 'rolled' && <div className="mt-20 text-8xl font-black text-yellow-400 animate-bounce drop-shadow-xl">{diceVal}</div>}
                            </div>
                        </div>
                    )}

                    {/* 오버레이: 카드 & 퀴즈 */}
                    {gameState === 'card' && currentCard && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-[3rem] p-10 max-w-4xl w-full text-center shadow-2xl border-8 border-indigo-100 pop-in">
                                <h2 className="text-4xl font-bold text-slate-500 mb-8">🔔 상황 발생!</h2>
                                <div className="bg-slate-50 border-4 border-slate-200 rounded-3xl p-8 mb-8">
                                    <div className={`text-6xl font-black mb-4 ${currentCard.color}`}>{currentCard.label}</div>
                                    <p className="text-3xl text-slate-700">{currentCard.desc}</p>
                                </div>
                                <div className="text-3xl font-bold text-slate-900 mb-8 bg-yellow-100 py-6 rounded-2xl shadow-sm">
                                    {teams[currentTurn].icon} <span className="text-indigo-700 underline underline-offset-8 decoration-4 decoration-indigo-300">
                                        {BOARD_TILES[teams[currentTurn].position].name.replace('\n', ' ')}
                                    </span>에게 유리할까요?
                                </div>
                                <div className="grid grid-cols-2 gap-6">
                                    <button onClick={() => checkAnswer('good')} className="bg-blue-100 hover:bg-blue-200 text-blue-700 py-8 rounded-3xl text-4xl font-black border-b-8 border-blue-300 active:translate-y-1 transition">👍 유리해요</button>
                                    <button onClick={() => checkAnswer('bad')} className="bg-red-100 hover:bg-red-200 text-red-700 py-8 rounded-3xl text-4xl font-black border-b-8 border-red-300 active:translate-y-1 transition">👎 불리해요</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 오버레이: 결과 */}
                    {gameState === 'result' && feedback && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4" onClick={nextTurn}>
                            <div className="bg-white rounded-[3rem] p-10 max-w-3xl w-full text-center shadow-2xl pop-in cursor-pointer border-8 border-white">
                                <div className="text-9xl mb-6">{feedback.isGood ? '🎉' : '💥'}</div>
                                <h2 className="text-6xl font-black mb-4 text-indigo-900">{feedback.result}</h2>
                                <p className="text-4xl font-bold text-pink-500 mb-8">{feedback.msg}</p>
                                <div className="bg-slate-100 p-8 rounded-3xl text-left text-2xl text-slate-800 font-medium leading-relaxed border-l-8 border-indigo-500">💡 {feedback.desc}</div>
                                <p className="mt-8 text-slate-400 text-xl animate-pulse">화면을 클릭하면 다음 차례로 넘어갑니다</p>
                            </div>
                        </div>
                    )}

                    {/* 오버레이: 최종 순위 (Podium) */}
                    {gameState === 'gameover' && (
                        <div className="fixed inset-0 bg-indigo-900/95 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-[3rem] p-8 max-w-5xl w-full text-center shadow-2xl pop-in relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-6 bg-gradient-to-r from-yellow-400 via-orange-500 to-pink-500"></div>
                                <h1 className="text-6xl font-black mb-12 text-indigo-900 mt-4">🏆 최종 결과 🏆</h1>
                                
                                {/* 단상 */}
                                <div className="flex items-end justify-center h-[500px] mb-12 gap-4">
                                    {/* 2등 */}
                                    {[...teams].sort((a,b) => b.score - a.score)[1] && (
                                        <div className="w-1/3 flex flex-col items-center justify-end podium-rise" style={{animationDelay: '0.2s'}}>
                                            <div className="mb-4 text-center">
                                                <div className="text-6xl mb-2">{[...teams].sort((a,b) => b.score - a.score)[1].icon}</div>
                                                <div className="text-2xl font-bold text-slate-600">{[...teams].sort((a,b) => b.score - a.score)[1].name}</div>
                                                <div className="text-4xl font-black text-indigo-600">{[...teams].sort((a,b) => b.score - a.score)[1].score}점</div>
                                            </div>
                                            <div className="w-full h-48 bg-slate-200 rounded-t-3xl flex items-center justify-center border-t-8 border-slate-300 text-6xl font-black text-white/50">2</div>
                                        </div>
                                    )}
                                    {/* 1등 */}
                                    {[...teams].sort((a,b) => b.score - a.score)[0] && (
                                        <div className="w-1/3 flex flex-col items-center justify-end podium-rise z-10" style={{animationDelay: '0s'}}>
                                            <div className="mb-4 text-center transform scale-125">
                                                <div className="text-8xl mb-2 animate-bounce">{[...teams].sort((a,b) => b.score - a.score)[0].icon}</div>
                                                <div className="text-3xl font-bold text-slate-800">{[...teams].sort((a,b) => b.score - a.score)[0].name}</div>
                                                <div className="text-5xl font-black text-yellow-500">{[...teams].sort((a,b) => b.score - a.score)[0].score}점</div>
                                            </div>
                                            <div className="w-full h-64 bg-yellow-400 rounded-t-3xl flex items-center justify-center border-t-8 border-yellow-300 text-8xl font-black text-white/50 shadow-xl">1</div>
                                        </div>
                                    )}
                                    {/* 3등 */}
                                    {[...teams].sort((a,b) => b.score - a.score)[2] && (
                                        <div className="w-1/3 flex flex-col items-center justify-end podium-rise" style={{animationDelay: '0.4s'}}>
                                            <div className="mb-4 text-center">
                                                <div className="text-6xl mb-2">{[...teams].sort((a,b) => b.score - a.score)[2].icon}</div>
                                                <div className="text-2xl font-bold text-slate-600">{[...teams].sort((a,b) => b.score - a.score)[2].name}</div>
                                                <div className="text-4xl font-black text-indigo-600">{[...teams].sort((a,b) => b.score - a.score)[2].score}점</div>
                                            </div>
                                            <div className="w-full h-32 bg-amber-600 rounded-t-3xl flex items-center justify-center border-t-8 border-amber-500 text-6xl font-black text-white/50">3</div>
                                        </div>
                                    )}
                                </div>

                                <button onClick={() => window.location.reload()} className="bg-indigo-600 text-white px-10 py-5 rounded-2xl text-3xl font-bold hover:bg-indigo-700 transition shadow-lg flex items-center justify-center gap-3 mx-auto">
                                    <Icons.Refresh /> 다시 하기
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
