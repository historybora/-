<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우당탕탕 환율 대모험</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        /* 화면 꽉 채우기 기본 설정 */
        html, body, #root {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* 스크롤 방지 */
            font-family: 'Pretendard', sans-serif;
            background-color: #fffbeb; /* 배경색 */
        }

        /* 배경 패턴 (반응형 대응) */
        .bg-pattern {
            background-image: radial-gradient(#fcd34d 2px, transparent 2px);
            background-size: 3vmin 3vmin; /* 패턴 크기도 화면에 비례 */
        }

        /* 팝업 애니메이션 */
        .pop-in { animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .rise-up { animation: riseUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; transform: translateY(100%); opacity: 0; }
        @keyframes riseUp { to { transform: translateY(0); opacity: 1; } }

        .token-transition { transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

        /* 반응형 텍스트 크기 유틸리티 */
        .text-responsive-xs { font-size: 1.5vmin; }
        .text-responsive-sm { font-size: 2vmin; }
        .text-responsive-base { font-size: 2.5vmin; }
        .text-responsive-lg { font-size: 3vmin; }
        .text-responsive-xl { font-size: 4vmin; }
        .text-responsive-2xl { font-size: 5vmin; }
        .text-responsive-3xl { font-size: 6vmin; }
        .text-responsive-4xl { font-size: 8vmin; }

        /* 3D 주사위 (반응형 크기) */
        .scene { width: 15vmin; height: 15vmin; perspective: 600px; display: flex; justify-content: center; align-items: center; }
        .cube { width: 10vmin; height: 10vmin; position: relative; transform-style: preserve-3d; transform: translateZ(-5vmin); transition: transform 1s; }
        .cube.rolling { animation: spinDice 0.6s infinite linear; }
        
        .cube__face {
            position: absolute; width: 10vmin; height: 10vmin;
            border: 0.4vmin solid #e5e7eb; background: white; border-radius: 1.5vmin;
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 0 0 2vmin rgba(0,0,0,0.1);
        }

        /* 주사위 면 위치 (vmin 단위로 변경) */
        .cube__face--1  { transform: rotateY(  0deg) translateZ(5vmin); }
        .cube__face--2  { transform: rotateY( 90deg) translateZ(5vmin); }
        .cube__face--3  { transform: rotateY(180deg) translateZ(5vmin); }
        .cube__face--4  { transform: rotateY(-90deg) translateZ(5vmin); }
        .cube__face--5  { transform: rotateX( 90deg) translateZ(5vmin); }
        .cube__face--6  { transform: rotateX(-90deg) translateZ(5vmin); }

        .show-1 { transform: translateZ(-5vmin) rotateY(   0deg); }
        .show-2 { transform: translateZ(-5vmin) rotateY( -90deg); }
        .show-3 { transform: translateZ(-5vmin) rotateY(-180deg); }
        .show-4 { transform: translateZ(-5vmin) rotateY(  90deg); }
        .show-5 { transform: translateZ(-5vmin) rotateX( -90deg); }
        .show-6 { transform: translateZ(-5vmin) rotateX(  90deg); }

        @keyframes spinDice { 0% { transform: translateZ(-5vmin) rotateX(0deg) rotateY(0deg) rotateZ(0deg); } 100% { transform: translateZ(-5vmin) rotateX(360deg) rotateY(360deg) rotateZ(360deg); } }
        
        .dot { width: 2vmin; height: 2vmin; background: #1e293b; border-radius: 50%; box-shadow: inset 0.1vmin 0.1vmin 0.3vmin rgba(0,0,0,0.4); }
        
        /* 주사위 내부 배치 (Flex/Grid) */
        .face-1 { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; }
        .face-2 { display: flex; justify-content: space-between; padding: 1.5vmin; width: 100%; height: 100%; }
        .face-2 .dot:nth-child(2) { align-self: flex-end; }
        .face-3 { display: flex; justify-content: space-between; padding: 1.5vmin; width: 100%; height: 100%; }
        .face-3 .dot:nth-child(2) { align-self: center; }
        .face-3 .dot:nth-child(3) { align-self: flex-end; }
        .face-4 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; padding: 1.5vmin; width: 100%; height: 100%; justify-items: center; align-items: center; }
        .face-5 { position: relative; width: 100%; height: 100%; }
        .face-5 .dot { position: absolute; }
        .face-5 .dot:nth-child(1) { top: 1.5vmin; left: 1.5vmin; }
        .face-5 .dot:nth-child(2) { top: 1.5vmin; right: 1.5vmin; }
        .face-5 .dot:nth-child(3) { top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .face-5 .dot:nth-child(4) { bottom: 1.5vmin; left: 1.5vmin; }
        .face-5 .dot:nth-child(5) { bottom: 1.5vmin; right: 1.5vmin; }
        .face-6 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 0.8vmin; padding: 1.2vmin; width: 100%; height: 100%; justify-items: center; align-items: center; }

        .title-gradient { background: linear-gradient(to right, #ec4899, #ef4444, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .bill-won { display: inline-block; background-color: #86efac; color: #14532d; border: 0.2vmin solid #166534; padding: 0 0.4vmin; font-weight: bold; font-size: 0.8em; border-radius: 0.4vmin; vertical-align: middle; line-height: 1.2; }
        .bill-dollar { display: inline-block; font-size: 1.2em; vertical-align: middle; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .keep-word { word-break: keep-all; white-space: pre-wrap; }
    </style>
</head>

                        }, 1000);
                    } else if (tile.type === 'island') {
                        setShowIslandPopup(true);
                        setTeams(prev => prev.map((t, i) => i === currentTurn ? { ...t, isStuck: true } : t));
                    } else if (tile.type === 'rest') {
                        setTimeout(nextTurn, 1500);
                    } else if (tile.type === 'bonus') {
                        startBonusGame();
                    } else if (tile.type === 'start') {
                        setTimeout(nextTurn, 1000);
                    } else {
                        setGameState('card');
                        setCurrentCard(SITUATION_CARDS[Math.floor(Math.random() * SITUATION_CARDS.length)]);
                    }
                }, 1000);
            };

            const startBonusGame = () => {
                const quiz = NONSENSE_QUIZZES[Math.floor(Math.random() * NONSENSE_QUIZZES.length)];
                setBonusQuiz(quiz);
                setBonusInput("");
                setGameState('bonus');
            };

            const checkBonusAnswer = () => {
                if (!bonusQuiz) return;
                if (bonusInput.replace(/\s+/g, '') === bonusQuiz.a.replace(/\s+/g, '')) {
                    setFeedback({ result: "정답! 🎉", msg: "+2점 획득!", desc: "넌센스 퀴즈 천재시네요!", isGood: true });
                    updateScore(2);
                    playSound('correct');
                } else {
                    setFeedback({ result: "땡! 😂", msg: "아쉬워요", desc: `정답은 "${bonusQuiz.a}" 였습니다!`, isGood: false });
                    playSound('wrong');
                }
                setGameState('result');
                setBonusQuiz(null);
            };

            const closeIslandPopup = () => {
                setShowIslandPopup(false);
                nextTurn();
            };

            const updateScore = (points) => {
                setTeams(prev => prev.map((t, i) => i === currentTurn ? { ...t, score: t.score + points } : t));
            };

            const checkAnswer = (choice) => {
                const activeTeam = teams[currentTurn];
                const tile = BOARD_TILES[activeTeam.position];
                const card = currentCard;
                let isFavorable = false, explanation = "";
                if (tile.role === 'export') {
                    if (card.type === 'UP') { isFavorable = true; explanation = "환율 상승(원화 약세)! 달러를 원화로 바꿀 때 돈을 더 많이 받아요! 👍"; }
                    else { isFavorable = false; explanation = "환율 하락(원화 강세)! 달러를 원화로 바꿀 때 돈이 줄어들어요. 😭"; }
                } else if (tile.role === 'import') {
                    if (card.type === 'UP') { isFavorable = false; explanation = "환율 상승! 달러를 살 때 원화를 더 많이 내야 해요. 💸"; }
                    else { isFavorable = true; explanation = "환율 하락! 더 적은 원화로 달러를 살 수 있어요! 👍"; }
                }
                if ((choice === 'good' && isFavorable) || (choice === 'bad' && !isFavorable)) {
                    setFeedback({ result: "정답! ⭕", msg: "+1점", desc: explanation, isGood: true });
                    updateScore(1);
                    playSound('correct');
                } else {
                    setFeedback({ result: "땡! ❌", msg: "아쉬워요", desc: explanation, isGood: false });
                    playSound('wrong');
                }
                setGameState('result');
            };

            const nextTurn = () => {
                setFeedback(null); setCurrentCard(null); setGameState('ready');
                setCurrentTurn(prev => (prev + 1) % teams.length);
            };

            const getGridStyle = (idx) => {
                let col, row;
                if (idx <= 6) { col = idx + 1; row = 1; }
                else if (idx <= 8) { col = 7; row = idx - 5; }
                else if (idx <= 15) { col = 7 - (idx - 9); row = 4; }
                else { col = 1; row = 4 - (idx - 15); }
                return { gridColumn: col, gridRow: row };
            };

            // --- 렌더링 ---
            return (
                <div className="w-full h-full flex flex-col bg-pattern overflow-hidden select-none relative">
                    <audio ref={bgmRef} src={SOUNDS.bgm} loop className="hidden" />

                    {/* Setup Screen */}
                    {setupMode && (
                        <div className="absolute inset-0 z-50 flex items-center justify-center bg-gradient-to-br from-sky-300 via-rose-200 to-amber-100 p-4">
                            <div className="absolute top-[2vmin] right-[2vmin] text-slate-500 font-bold text-responsive-lg z-20">보라쌤과 사회를 보라</div>
                            <div className="bg-white/60 backdrop-blur-xl p-[4vmin] rounded-[3vmin] shadow-xl text-center border-4 border-white w-[80vw] max-w-[800px] pop-in">
                                <h1 className="text-responsive-4xl font-black mb-[4vmin] drop-shadow-sm flex items-center justify-center gap-4">
                                    💵 <span className="title-gradient">우당탕탕<br/>환율 대모험</span> 🌏
                                </h1>
                                <p className="text-responsive-xl text-slate-600 mb-[6vmin] font-bold">우리 반 최고의 경제왕 팀은 누구?</p>
                                <div className="mb-[6vmin]">
                                    <label className="block text-responsive-2xl font-bold mb-[4vmin] text-slate-700">참여 팀 수 선택</label>
                                    <div className="flex justify-center gap-[2vmin]">
                                        {[2, 3, 4, 5, 6].map(num => (
                                            <button key={num} onClick={() => setTeamCount(num)} className={`w-[8vmin] h-[8vmin] rounded-[2vmin] text-responsive-2xl font-bold transition-all ${teamCount === num ? 'bg-yellow-400 text-white scale-125 shadow-xl ring-4 ring-yellow-200' : 'bg-white hover:bg-slate-100 hover:scale-110 shadow-md'}`}>{num}</button>
                                        ))}
                                    </div>
                                </div>
                                <button onClick={startGame} className="w-full bg-gradient-to-r from-pink-500 to-yellow-500 py-[3vmin] rounded-[2vmin] text-responsive-3xl font-black text-white shadow-2xl hover:scale-105 transition">게임 시작하기 🚀</button>
                            </div>
                        </div>
                    )}

                    {/* Game UI */}
                    <div className="w-full h-[15%] min-h-[60px] bg-white/80 backdrop-blur-md shadow-xl flex justify-between items-center z-10 px-[2vmin] border-b-4 border-white shrink-0">
                        <div className="flex items-center gap-[2vmin]">
                             <button onClick={finishGame} className="bg-red-500 hover:bg-red-600 text-white px-[2vmin] py-[1vmin] rounded-[1vmin] font-black text-responsive-lg shadow-lg transition flex items-center gap-2 hover:scale-105 whitespace-nowrap"><div className="w-[3vmin] h-[3vmin]"><Icons.Flag /></div> 경기 종료</button>
                             <button onClick={() => setIsMuted(!isMuted)} className="text-slate-400 hover:text-slate-600 transition hover:scale-110 w-[4vmin] h-[4vmin]">{isMuted ? <Icons.VolumeX /> : <Icons.Volume2 />}</button>
                        </div>
                        <div className="flex gap-[2vmin] overflow-x-auto items-center py-2 px-2 no-scrollbar h-full">
                            {teams.map((team, idx) => (
                                <div key={idx} className={`flex items-center gap-[1.5vmin] px-[2vmin] py-[1vmin] rounded-full border-[0.3vmin] transition-all duration-300 ${idx === currentTurn ? 'bg-yellow-50 border-yellow-400 scale-110 shadow-xl z-10 ring-[0.3vmin] ring-yellow-200' : 'bg-white border-slate-200 opacity-60 grayscale-[0.5]'}`}>
                                    <span className="text-responsive-2xl">{team.icon}</span>
                                    <span className="font-bold text-slate-800 text-responsive-base whitespace-nowrap">{team.name}</span>
                                    <span className="bg-slate-800 text-white px-[1vmin] rounded text-responsive-base font-mono">{team.score}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="flex-1 w-full flex items-center justify-center p-[2vmin] relative">
                        <div className="w-full h-full grid grid-cols-7 grid-rows-4 gap-[1vmin] relative">
                            <div className="col-start-2 col-end-7 row-start-2 row-end-4 bg-white/70 backdrop-blur-sm rounded-[3vmin] flex flex-col items-center justify-center border-[0.5vmin] border-dashed border-indigo-200">
                                <h1 className="text-responsive-4xl font-black text-indigo-900/10 tracking-tight mb-[2vmin] select-none whitespace-nowrap">💵 우당탕탕 환율 대모험 🌏</h1>
                                <div className="text-responsive-xl font-bold text-slate-500 mb-[4vmin] bg-white/80 px-[4vmin] py-[1vmin] rounded-full border border-slate-300 shadow-sm">💡 규칙: 정답 +1점 / 오답 0점</div>
                                <div className="bg-indigo-600 text-white px-[5vmin] py-[2vmin] rounded-full shadow-2xl transform scale-110 border-[0.4vmin] border-indigo-400">
                                    <span className="text-responsive-2xl font-bold animate-pulse block whitespace-nowrap">📢 {history[0]}</span>
                                </div>
                            </div>

                            {BOARD_TILES.map((tile, idx) => (
                                <div key={idx} style={getGridStyle(idx)} className={`relative border-[0.4vmin] rounded-[2vmin] flex flex-col items-center justify-center text-center p-[1vmin] shadow-md transition-colors ${tile.bg} ${idx === teams[currentTurn].position ? 'border-yellow-500 bg-yellow-50 ring-[0.6vmin] ring-yellow-300 z-10 scale-105 shadow-2xl' : 'border-slate-300 hover:border-indigo-300'}`}>
                                    <div className="text-responsive-3xl mb-[1vmin] drop-shadow-md">{tile.icon}</div>
                                    <div className="font-bold text-responsive-sm text-slate-900 leading-tight break-keep keep-word">{tile.name}</div>
                                    <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                        <div className="grid grid-cols-2 gap-[0.5vmin] content-center justify-items-center w-full h-full p-[1vmin]">
                                            {teams.map((team, tIdx) => team.position === idx && (
                                                <div key={tIdx} className={`w-[4vmin] h-[4vmin] rounded-full shadow-md flex items-center justify-center text-responsive-lg border-[0.3vmin] border-white token-transition ${team.color} z-20 transform`} style={{ transform: tIdx === currentTurn ? 'scale(1.3) translateY(-1vmin)' : 'scale(1)' }}>{team.icon}</div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="absolute bottom-[5vmin] left-1/2 -translate-x-1/2 z-20">
                        {gameState === 'ready' && (
                             <button onClick={rollDice} className={`flex flex-col items-center justify-center w-[12vmin] h-[12vmin] rounded-full shadow-xl border-[0.8vmin] border-white transition-all hover:scale-110 active:scale-95 ${teams[currentTurn].color} animate-bounce cursor-pointer group`}>
                                <span className="text-responsive-3xl mb-1 group-hover:rotate-12 transition-transform">🎲</span>
                                <span className="text-white font-black text-responsive-base shadow-black drop-shadow-lg">GO!</span>
                            </button>
                        )}
                    </div>

                    <div className="absolute bottom-[3vmin] right-[3vmin] z-50 pointer-events-auto">
                        <button onClick={toggleFullscreen} className="bg-white/80 p-[1.5vmin] rounded-full shadow-lg border-[0.3vmin] border-slate-300 hover:bg-indigo-100 transition active:scale-95 w-[6vmin] h-[6vmin]">
                            {isFullscreen ? <Icons.Minimize /> : <Icons.Maximize />}
                        </button>
                    </div>

                    {/* Popups (Fully Centered, Responsive Size) */}
                    {showIslandPopup && (
                        <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-[4vmin]">
                            <div className="bg-white rounded-[3vmin] p-[6vmin] max-w-[80vw] text-center shadow-2xl pop-in">
                                <div className="text-responsive-4xl mb-[3vmin]">🏝️</div>
                                <h2 className="text-responsive-3xl font-black text-slate-800 mb-[3vmin]">무인도 도착!</h2>
                                <p className="text-responsive-xl text-slate-600 font-bold mb-[5vmin]">이번 턴은 쉬어갑니다 💤</p>
                                <button onClick={closeIslandPopup} className="bg-indigo-600 text-white px-[6vmin] py-[2vmin] rounded-[2vmin] text-responsive-xl font-bold hover:bg-indigo-700 transition">확인</button>
                            </div>
                        </div>
                    )}

                    {(gameState === 'rolling' || gameState === 'rolled') && (
                        <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center">
                            <div className="flex flex-col items-center pop-in">
                                <div className="text-white text-responsive-4xl font-black mb-[8vmin] drop-shadow-md">{teams[currentTurn].name} 차례!</div>
                                <div className="transform scale-[1.5]"><Dice3D val={diceVal} isRolling={gameState === 'rolling'} /></div>
                                {gameState === 'rolled' && <div className="mt-[10vmin] text-responsive-4xl font-black text-yellow-400 animate-bounce drop-shadow-md">{diceVal}</div>}
                            </div>
                        </div>
                    )}

                    {gameState === 'bonus' && bonusQuiz && (
                        <div className="absolute inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-[4vmin]">
                            <div className="bg-white rounded-[3vmin] p-[5vmin] max-w-[80vw] w-full text-center shadow-2xl border-[1vmin] border-yellow-300 pop-in relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-[3vmin] bg-yellow-300"></div>
                                <h2 className="text-responsive-3xl font-black text-indigo-900 mb-[4vmin] mt-[2vmin]">🎁 보너스 넌센스 퀴즈!</h2>
                                <div className="bg-indigo-50 p-[4vmin] rounded-[2vmin] border-[0.5vmin] border-indigo-100 mb-[4vmin]">
                                    <p className="text-responsive-2xl font-bold text-slate-800 leading-normal keep-word">{bonusQuiz.q}</p>
                                </div>
                                <div className="mb-[4vmin]">
                                    <input type="text" value={bonusInput} onChange={(e) => setBonusInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && checkBonusAnswer()} placeholder="정답을 입력하세요" className="w-full text-responsive-2xl p-[2vmin] rounded-[1.5vmin] border-[0.5vmin] border-slate-300 text-center focus:border-indigo-500 outline-none" autoFocus />
                                </div>
                                <button onClick={checkBonusAnswer} className="w-full bg-gradient-to-r from-yellow-400 to-orange-500 text-white py-[2vmin] rounded-[2vmin] text-responsive-2xl font-black shadow-xl hover:scale-105 transition transform">정답 확인 (+2점)</button>
                            </div>
                        </div>
                    )}

                    {gameState === 'card' && currentCard && (
                        <div className="absolute inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-[4vmin]">
                            <div className="bg-white rounded-[3vmin] p-[4vmin] w-[90vw] max-h-[90vh] overflow-y-auto text-center shadow-2xl border-[1vmin] border-indigo-100 pop-in flex flex-col gap-[3vmin]">
                                <div className="flex flex-col md:flex-row justify-center items-stretch gap-[3vmin] mb-[1vmin]">
                                    <div className="flex-1 bg-slate-50 border-[0.5vmin] border-slate-200 rounded-[2vmin] p-[3vmin] shadow-inner flex flex-col justify-center min-h-[30vh]">
                                        <div className="text-responsive-xl text-slate-500 font-bold mb-[2vmin]">뉴스 속보 📰</div>
                                        <div className={`text-responsive-3xl font-black mb-[1vmin] ${currentCard.color}`}>{currentCard.label}</div>
                                        <div className={`text-responsive-2xl font-black mb-[3vmin] ${currentCard.color}`}>{currentCard.subLabel}</div>
                                        <div className="text-responsive-xl text-slate-700 font-bold leading-snug keep-word">{currentCard.desc}</div>
                                        <div className="text-responsive-base text-slate-500 mt-[2vmin]">{currentCard.detail}</div>
                                    </div>
                                    <div className="flex-1 bg-yellow-50 border-[0.5vmin] border-yellow-200 rounded-[2vmin] p-[3vmin] shadow-inner flex flex-col justify-center min-h-[30vh]">
                                        <div className="text-responsive-xl text-yellow-700 font-bold mb-[2vmin]">현재 우리 팀은?</div>
                                        <div className="text-responsive-4xl mb-[3vmin] animate-pulse filter drop-shadow-xl">{BOARD_TILES[teams[currentTurn].position].scene}</div>
                                        <div className="text-responsive-2xl font-black text-slate-800 mb-[2vmin]">{BOARD_TILES[teams[currentTurn].position].name.split('\n')[0]}</div>
                                        <div className="text-responsive-lg text-slate-600 bg-white/60 p-[2vmin] rounded-[1.5vmin] font-bold leading-relaxed whitespace-nowrap">"{BOARD_TILES[teams[currentTurn].position].desc}"</div>
                                    </div>
                                </div>
                                <div className="text-responsive-2xl font-bold text-slate-900 mb-[1vmin]">이 상황이 <span className="text-indigo-600 underline decoration-4 underline-offset-4">{BOARD_TILES[teams[currentTurn].position].name.split('\n')[0]}</span>에게 유리할까요?</div>
                                <div className="grid grid-cols-2 gap-[3vmin]">
                                    <button onClick={() => checkAnswer('good')} className="bg-blue-100 hover:bg-blue-200 text-blue-700 py-[3vmin] rounded-[2vmin] text-responsive-2xl font-black border-b-[0.8vmin] border-blue-300 active:translate-y-1 transition-transform transform hover:scale-[1.02] flex flex-col items-center gap-1"><span>👍</span> <span>유리해요!</span></button>
                                    <button onClick={() => checkAnswer('bad')} className="bg-red-100 hover:bg-red-200 text-red-700 py-[3vmin] rounded-[2vmin] text-responsive-2xl font-black border-b-[0.8vmin] border-red-300 active:translate-y-1 transition-transform transform hover:scale-[1.02] flex flex-col items-center gap-1"><span>👎</span> <span>불리해요!</span></button>
                                </div>
                            </div>
                        </div>
                    )}

                    {gameState === 'result' && feedback && (
                        <div className="absolute inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-[4vmin]" onClick={nextTurn}>
                            <div className="bg-white rounded-[3vmin] p-[5vmin] max-w-[80vw] text-center shadow-2xl pop-in cursor-pointer border-[1vmin] border-white ring-[0.5vmin] ring-indigo-200 max-h-[90vh] overflow-y-auto">
                                <div className="text-responsive-4xl mb-[3vmin] animate-bounce">{feedback.isGood ? '🎉' : '🤔'}</div>
                                <h2 className="text-responsive-3xl font-black mb-[2vmin] text-indigo-900">{feedback.result}</h2>
                                <p className="text-responsive-2xl font-bold text-pink-500 mb-[4vmin]">{feedback.msg}</p>
                                <div className="bg-slate-100 p-[4vmin] rounded-[2vmin] text-left text-responsive-xl text-slate-800 font-bold leading-relaxed border-l-[1vmin] border-indigo-500 shadow-inner">💡 선생님 말씀:<br/><span className="text-responsive-base font-medium text-slate-600 mt-[1vmin] block keep-word">{feedback.desc}</span></div>
                                <p className="mt-[4vmin] text-slate-400 text-responsive-sm animate-pulse">화면을 클릭하면 다음 차례로 넘어갑니다</p>
                            </div>
                        </div>
                    )}

                    {gameState === 'gameover' && (
                        <div className="absolute inset-0 bg-indigo-900/95 z-50 flex items-center justify-center p-[4vmin]">
                            <div className="bg-white rounded-[3vmin] p-[4vmin] max-w-[90vw] w-full text-center shadow-2xl pop-in relative overflow-hidden h-[85vh] flex flex-col">
                                <div className="absolute top-0 left-0 w-full h-[1vmin] bg-gradient-to-r from-yellow-400 via-orange-500 to-pink-500"></div>
                                <h1 className="text-responsive-3xl font-black mb-[4vmin] text-indigo-900 mt-[2vmin]">🏆 경기 결과 발표 🏆</h1>
                                <div className="flex-1 flex items-end justify-center gap-[4vmin] pb-[4vmin] overflow-x-auto">
                                    {[...teams].sort((a,b) => b.score - a.score)[1] && (
                                        <div className="w-1/4 flex flex-col items-center justify-end rise-up" style={{animationDelay: '0.5s'}}>
                                            <div className="mb-[2vmin] text-center">
                                                <div className="text-responsive-3xl mb-[1vmin]">{[...teams].sort((a,b) => b.score - a.score)[1].icon}</div>
                                                <div className="text-responsive-base font-bold text-slate-600 mb-[0.5vmin]">{[...teams].sort((a,b) => b.score - a.score)[1].name}</div>
                                                <div className="text-responsive-xl font-black text-indigo-600">{[...teams].sort((a,b) => b.score - a.score)[1].score}점</div>
                                            </div>
                                            <div className="w-full h-[20vh] bg-slate-200 rounded-t-[2vmin] flex items-center justify-center border-t-[0.8vmin] border-slate-300 text-responsive-4xl font-black text-white/50 shadow-inner">2</div>
                                        </div>
                                    )}
                                    {[...teams].sort((a,b) => b.score - a.score)[0] && (
                                        <div className="w-1/3 flex flex-col items-center justify-end z-10 rise-up" style={{animationDelay: '0s'}}>
                                            <div className="mb-[2vmin] text-center transform scale-110">
                                                <div className="text-responsive-4xl mb-[1vmin] animate-bounce">{[...teams].sort((a,b) => b.score - a.score)[0].icon}</div>
                                                <div className="text-responsive-lg font-bold text-slate-800 mb-[0.5vmin]">{[...teams].sort((a,b) => b.score - a.score)[0].name}</div>
                                                <div className="text-responsive-2xl font-black text-yellow-500 drop-shadow-lg">{[...teams].sort((a,b) => b.score - a.score)[0].score}점</div>
                                            </div>
                                            <div className="w-full h-[30vh] bg-yellow-400 rounded-t-[2vmin] flex items-center justify-center border-t-[0.8vmin] border-yellow-300 text-responsive-4xl font-black text-white/50 shadow-2xl relative"><div className="absolute -top-[5vmin] text-responsive-4xl">👑</div>1</div>
                                        </div>
                                    )}
                                    {[...teams].sort((a,b) => b.score - a.score)[2] && (
                                        <div className="w-1/4 flex flex-col items-center justify-end rise-up" style={{animationDelay: '1s'}}>
                                            <div className="mb-[2vmin] text-center">
                                                <div className="text-responsive-3xl mb-[1vmin]">{[...teams].sort((a,b) => b.score - a.score)[2].icon}</div>
                                                <div className="text-responsive-base font-bold text-slate-600 mb-[0.5vmin]">{[...teams].sort((a,b) => b.score - a.score)[2].name}</div>
                                                <div className="text-responsive-xl font-black text-indigo-600">{[...teams].sort((a,b) => b.score - a.score)[2].score}점</div>
                                            </div>
                                            <div className="w-full h-[15vh] bg-amber-600 rounded-t-[2vmin] flex items-center justify-center border-t-[0.8vmin] border-amber-500 text-responsive-4xl font-black text-white/50 shadow-inner">3</div>
                                        </div>
                                    )}
                                </div>
                                <button onClick={() => window.location.reload()} className="bg-indigo-600 text-white px-[6vmin] py-[2vmin] rounded-[2vmin] text-responsive-xl font-bold hover:bg-indigo-700 transition shadow-2xl flex items-center justify-center gap-[2vmin] mx-auto hover:scale-105"><Icons.Refresh /> 새로운 게임 시작</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
