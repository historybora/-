<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 핵심: 1600px 고정 뷰포트로 모바일에서 자동 축소(꽉 찬 화면) 유도 -->
    <meta name="viewport" content="width=1600, user-scalable=yes">
    <title>우당탕탕 환율 대모험</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        /* PC 해상도 강제 고정 및 배경 설정 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-width: 1600px; /* 가로 고정 */
            min-height: 100vh;
            font-family: 'Pretendard', sans-serif;
            background-color: #fffbeb;
            background-image: radial-gradient(#fcd34d 2px, transparent 2px);
            background-size: 40px 40px;
            overflow: hidden; /* 기본 스크롤 방지 */
        }

        #root {
            width: 100%;
            height: 100%;
        }

        /* 팝업 애니메이션 */
        .pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .rise-up { animation: riseUp 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; transform: translateY(100%); opacity: 0; }
        @keyframes riseUp { 0% { transform: translateY(100%); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

        .token-transition { transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

        /* 3D 주사위 스타일 */
        .scene { width: 150px; height: 150px; perspective: 600px; display: flex; justify-content: center; align-items: center; }
        .cube { width: 100px; height: 100px; position: relative; transform-style: preserve-3d; transform: translateZ(-50px); transition: transform 1s; }
        .cube.rolling { animation: spinDice 0.6s infinite linear; }
        .cube__face { position: absolute; width: 100px; height: 100px; border: 4px solid #e5e7eb; background: white; border-radius: 16px; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 0 20px rgba(0,0,0,0.1); }
        .cube__face--1  { transform: rotateY(  0deg) translateZ(50px); }
        .cube__face--2  { transform: rotateY( 90deg) translateZ(50px); }
        .cube__face--3  { transform: rotateY(180deg) translateZ(50px); }
        .cube__face--4  { transform: rotateY(-90deg) translateZ(50px); }
        .cube__face--5  { transform: rotateX( 90deg) translateZ(50px); }
        .cube__face--6  { transform: rotateX(-90deg) translateZ(50px); }
        .show-1 { transform: translateZ(-50px) rotateY(   0deg); }
        .show-2 { transform: translateZ(-50px) rotateY( -90deg); }
        .show-3 { transform: translateZ(-50px) rotateY(-180deg); }
        .show-4 { transform: translateZ(-50px) rotateY(  90deg); }
        .show-5 { transform: translateZ(-50px) rotateX( -90deg); }
        .show-6 { transform: translateZ(-50px) rotateX(  90deg); }
        @keyframes spinDice { 0% { transform: translateZ(-50px) rotateX(0deg) rotateY(0deg) rotateZ(0deg); } 100% { transform: translateZ(-50px) rotateX(360deg) rotateY(360deg) rotateZ(360deg); } }
        
        .dot { width: 20px; height: 20px; background: #1e293b; border-radius: 50%; box-shadow: inset 1px 1px 3px rgba(0,0,0,0.4); }
        .face-1 { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; }
        .face-2 { display: flex; justify-content: space-between; padding: 16px; width: 100%; height: 100%; }
        .face-2 .dot:nth-child(2) { align-self: flex-end; }
        .face-3 { display: flex; justify-content: space-between; padding: 16px; width: 100%; height: 100%; }
        .face-3 .dot:nth-child(2) { align-self: center; }
        .face-3 .dot:nth-child(3) { align-self: flex-end; }
        .face-4 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; padding: 16px; width: 100%; height: 100%; justify-items: center; align-items: center; }
        .face-5 { position: relative; width: 100%; height: 100%; }
        .face-5 .dot { position: absolute; }
        .face-5 .dot:nth-child(1) { top: 16px; left: 16px; }
        .face-5 .dot:nth-child(2) { top: 16px; right: 16px; }
        .face-5 .dot:nth-child(3) { top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .face-5 .dot:nth-child(4) { bottom: 16px; left: 16px; }
        .face-5 .dot:nth-child(5) { bottom: 16px; right: 16px; }
        .face-6 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 8px; padding: 12px; width: 100%; height: 100%; justify-items: center; align-items: center; }

        .title-gradient { background: linear-gradient(to right, #ec4899, #ef4444, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .bill-won { display: inline-block; background-color: #86efac; color: #14532d; border: 2px solid #166534; padding: 0 4px; font-weight: bold; font-size: 0.8em; border-radius: 4px; vertical-align: middle; line-height: 1.2; }
        .bill-dollar { display: inline-block; font-size: 1.2em; vertical-align: middle; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .keep-word { word-break: keep-all; white-space: pre-wrap; }
    </style>
</head>

                    looped = true;

                setTeams(prev => prev.map((t, i) => i === currentTurn ? { ...t, position: nextPos } : t));
                setTimeout(() => {
                    if (looped) updateScore(5);
                    const tile = BOARD_TILES[nextPos];

                    }
                }, 1000);
            };

            const startBonusGame = () => {
                const quiz = NONSENSE_QUIZZES[Math.floor(Math.random() * NONSENSE_QUIZZES.length)];
                setBonusQuiz(quiz);
                setBonusInput("");
                setGameState('bonus');
            };

            const checkBonusAnswer = () => {
                if (!bonusQuiz) return;
                if (bonusInput.replace(/\s+/g, '') === bonusQuiz.a.replace(/\s+/g, '')) {
                    setFeedback({ result: "정답! 🎉", msg: "+2점 획득!", desc: "넌센스 퀴즈 천재시네요!", isGood: true });
                    updateScore(2);
                    playSound('correct');
                } else {
                    setFeedback({ result: "땡! 😂", msg: "아쉬워요", desc: `정답은 "${bonusQuiz.a}" 였습니다!`, isGood: false });
                    playSound('wrong');
                }
                setGameState('result');
                setBonusQuiz(null);
            };

            const closeIslandPopup = () => {
                setShowIslandPopup(false);
                nextTurn();
            };

            const updateScore = (points) => {
                setTeams(prev => prev.map((t, i) => i === currentTurn ? { ...t, score: t.score + points } : t));
            };

            const checkAnswer = (choice) => {
                const activeTeam = teams[currentTurn];
                const tile = BOARD_TILES[activeTeam.position];
                const card = currentCard;
                let isFavorable = false, explanation = "";
                if (tile.role === 'export') {
                    if (card.type === 'UP') { isFavorable = true; explanation = "환율 상승(원화 약세)! 달러를 원화로 바꿀 때 돈을 더 많이 받아요! 👍"; }
                    else { isFavorable = false; explanation = "환율 하락(원화 강세)! 달러를 원화로 바꿀 때 돈이 줄어들어요. 😭"; }
                } else if (tile.role === 'import') {
                    if (card.type === 'UP') { isFavorable = false; explanation = "환율 상승! 달러를 살 때 원화를 더 많이 내야 해요. 💸"; }
                    else { isFavorable = true; explanation = "환율 하락! 더 적은 원화로 달러를 살 수 있어요! 👍"; }
                }
                if ((choice === 'good' && isFavorable) || (choice === 'bad' && !isFavorable)) {
                    setFeedback({ result: "정답! ⭕", msg: "+1점", desc: explanation, isGood: true });
                    updateScore(1);
                    playSound('correct');
                } else {
                    setFeedback({ result: "땡! ❌", msg: "아쉬워요", desc: explanation, isGood: false });
                    playSound('wrong');
                }
                setGameState('result');
            };

            const nextTurn = () => {
                setFeedback(null); setCurrentCard(null); setGameState('ready');
                setCurrentTurn(prev => (prev + 1) % teams.length);
            };

            const getGridStyle = (idx) => {
                let col, row;
                if (idx <= 6) { col = idx + 1; row = 1; }
                else if (idx <= 8) { col = 7; row = idx - 5; }
                else if (idx <= 15) { col = 7 - (idx - 9); row = 4; }
                else { col = 1; row = 4 - (idx - 15); }
                return { gridColumn: col, gridRow: row };
            };

            return (
                <div className="w-full h-full flex flex-col bg-pattern overflow-hidden select-none relative">
                    <audio ref={bgmRef} src={SOUNDS.bgm} loop className="hidden" />

                    {setupMode ? (
                        <div className="w-full h-full flex items-center justify-center bg-gradient-to-br from-sky-300 via-rose-200 to-amber-100 text-slate-800 p-8 relative overflow-hidden">
                            <div className="absolute top-8 right-8 text-slate-500 font-bold text-3xl z-20">보라쌤과 사회를 보라</div>
                            <div className="bg-white/60 backdrop-blur-xl p-16 rounded-[4rem] shadow-[0_0_60px_rgba(255,255,255,0.8)] text-center border-4 border-white max-w-4xl w-full z-10 pop-in">
                                <h1 className="text-7xl font-black mb-10 drop-shadow-sm flex items-center justify-center gap-6">
                                    💵 <span className="title-gradient">우당탕탕<br/>환율 대모험</span> 🌏
                                </h1>
                                <p className="text-4xl text-slate-600 mb-16 font-bold">우리 반 최고의 경제왕 팀은 누구?</p>
                                <div className="mb-16">
                                    <label className="block text-5xl font-bold mb-10 text-slate-700">참여 팀 수 선택</label>
                                    <div className="flex justify-center gap-8">
                                        {[2, 3, 4, 5, 6].map(num => (
                                            <button key={num} onClick={() => setTeamCount(num)} className={`w-28 h-28 rounded-3xl text-6xl font-bold transition-all ${teamCount === num ? 'bg-yellow-400 text-white scale-125 shadow-xl ring-8 ring-yellow-200' : 'bg-white hover:bg-slate-100 hover:scale-110 shadow-md'}`}>{num}</button>
                                        ))}
                                    </div>
                                </div>
                                <button onClick={startGame} className="w-full bg-gradient-to-r from-pink-500 to-yellow-500 py-12 rounded-[2rem] text-6xl font-black text-white shadow-2xl hover:scale-105 hover:shadow-pink-300/50 transition duration-300">게임 시작하기 🚀</button>
                            </div>
                        </div>
                    ) : (
                        <div className="w-full h-full flex flex-col">
                            {/* 상단바 */}
                            <div className="bg-white/80 backdrop-blur-md shadow-xl p-6 flex justify-between items-center z-10 px-10 h-28 border-b-4 border-white shrink-0">
                                <div className="flex items-center gap-8">
                                     <button onClick={finishGame} className="bg-red-500 hover:bg-red-600 text-white px-8 py-3 rounded-2xl font-black text-3xl shadow-lg transition flex items-center gap-3 hover:scale-105 whitespace-nowrap"><Icons.Flag /> 경기 종료</button>
                                     <button onClick={() => setIsMuted(!isMuted)} className="text-slate-400 hover:text-slate-600 transition hover:scale-110">{isMuted ? <Icons.VolumeX /> : <Icons.Volume2 />}</button>
                                </div>
                                <div className="flex gap-6 overflow-x-auto items-center py-4 px-4 no-scrollbar">
                                    {teams.map((team, idx) => (
                                        <div key={idx} className={`flex items-center gap-4 px-8 py-4 rounded-full border-4 transition-all duration-300 ${idx === currentTurn ? 'bg-yellow-50 border-yellow-400 scale-110 shadow-xl z-10 ring-4 ring-yellow-200 ml-2' : 'bg-white border-slate-200 opacity-60 grayscale-[0.5]'}`}>
                                            <span className="text-5xl">{team.icon}</span>
                                            <span className="font-bold text-slate-800 text-3xl whitespace-nowrap">{team.name}</span>
                                            <span className="bg-slate-800 text-white px-5 py-1 rounded-xl text-3xl font-mono">{team.score}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* 보드판 영역 */}
                            <div className="flex-1 flex items-center justify-center p-8 relative">
                                <div className="w-full h-full max-w-[1500px] grid grid-cols-7 grid-rows-4 gap-4 relative">
                                    <div className="col-start-2 col-end-7 row-start-2 row-end-4 bg-white/70 backdrop-blur-sm rounded-[3rem] flex flex-col items-center justify-center border-8 border-dashed border-indigo-200">
                                        <h1 className="text-8xl font-black text-indigo-900/10 tracking-tight mb-4 select-none whitespace-nowrap">💵 우당탕탕 환율 대모험 🌏</h1>
                                        <div className="text-4xl font-bold text-slate-500 mb-8 bg-white/80 px-10 py-3 rounded-full border border-slate-300 shadow-sm">💡 규칙: 정답 +1점 / 오답 0점</div>
                                        <div className="bg-indigo-600 text-white px-16 py-8 rounded-full shadow-2xl transform scale-110 border-4 border-indigo-400">
                                            <span className="text-5xl font-bold animate-pulse block whitespace-nowrap">📢 {history[0]}</span>
                                        </div>
                                    </div>

                                    {BOARD_TILES.map((tile, idx) => (
                                        <div key={idx} style={getGridStyle(idx)} className={`relative border-[6px] rounded-[2.5rem] flex flex-col items-center justify-center text-center p-4 shadow-md transition-colors ${tile.bg} ${idx === teams[currentTurn].position ? 'border-yellow-500 bg-yellow-50 ring-8 ring-yellow-300 z-10 scale-105 shadow-2xl' : 'border-slate-300 hover:border-indigo-300'}`}>
                                            <div className="text-7xl mb-4 drop-shadow-md">{tile.icon}</div>
                                            <div className="font-bold text-3xl text-slate-900 leading-tight break-keep keep-word">{tile.name}</div>
                                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                                <div className="grid grid-cols-2 gap-3 content-center justify-items-center w-full h-full p-4">
                                                    {teams.map((team, tIdx) => team.position === idx && (
                                                        <div key={tIdx} className={`w-24 h-24 rounded-full shadow-[0_10px_20px_rgba(0,0,0,0.3)] flex items-center justify-center text-6xl border-[6px] border-white token-transition ${team.color} z-20 transform hover:scale-125 transition-transform`} style={{ transform: tIdx === currentTurn ? 'scale(1.3) translateY(-15px)' : 'scale(1)' }}>{team.icon}</div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* 주사위 버튼 */}
                            <div className="absolute bottom-10 left-1/2 -translate-x-1/2 z-20">
                                {gameState === 'ready' && (
                                     <button onClick={rollDice} className={`flex flex-col items-center justify-center w-56 h-56 rounded-full shadow-[0_20px_50px_rgba(0,0,0,0.4)] border-[12px] border-white transition-all hover:scale-110 active:scale-95 ${teams[currentTurn].color} animate-bounce cursor-pointer group`}>
                                        <span className="text-8xl mb-2 group-hover:rotate-12 transition-transform">🎲</span>
                                        <span className="text-white font-black text-5xl shadow-black drop-shadow-lg">GO!</span>
                                    </button>
                                )}
                            </div>

                            {/* 전체화면 토글 버튼 (우측 하단) */}
                            <div className="absolute bottom-8 right-8 z-50 pointer-events-auto">
                                <button onClick={toggleFullscreen} className="bg-white/80 p-4 rounded-full shadow-lg border-2 border-slate-300 hover:bg-indigo-100 transition active:scale-95">
                                    {isFullscreen ? <Icons.Minimize /> : <Icons.Maximize />}
                                </button>
                            </div>

                            {/* 팝업들 */}
                            {showIslandPopup && (
                                <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-10">
                                    <div className="bg-white rounded-[4rem] p-16 max-w-4xl w-full text-center shadow-2xl pop-in">
                                        <div className="text-[12rem] mb-8">🏝️</div>
                                        <h2 className="text-7xl font-black text-slate-800 mb-8">무인도 도착!</h2>
                                        <p className="text-5xl text-slate-600 font-bold mb-16">이번 턴은 쉬어갑니다 💤</p>
                                        <button onClick={closeIslandPopup} className="bg-indigo-600 text-white px-16 py-8 rounded-[3rem] text-5xl font-bold hover:bg-indigo-700 transition">확인</button>
                                    </div>
                                </div>
                            )}

                            {(gameState === 'rolling' || gameState === 'rolled') && (
                                <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center">
                                    <div className="flex flex-col items-center pop-in">
                                        <div className="text-white text-7xl font-black mb-24 drop-shadow-[0_5px_5px_rgba(0,0,0,0.5)]">{teams[currentTurn].name} 차례!</div>
                                        <div className="transform scale-[3.0]"><Dice3D val={diceVal} isRolling={gameState === 'rolling'} /></div>
                                        {gameState === 'rolled' && <div className="mt-40 text-[10rem] font-black text-yellow-400 animate-bounce drop-shadow-[0_10px_10px_rgba(0,0,0,0.5)]">{diceVal}</div>}
                                    </div>
                                </div>
                            )}

                            {gameState === 'bonus' && bonusQuiz && (
                                <div className="absolute inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-10">
                                    <div className="bg-white rounded-[4rem] p-16 max-w-5xl w-full text-center shadow-2xl border-[16px] border-yellow-300 pop-in relative overflow-hidden">
                                        <div className="absolute top-0 left-0 w-full h-12 bg-yellow-300"></div>
                                        <h2 className="text-7xl font-black text-indigo-900 mb-16 mt-4">🎁 보너스 넌센스 퀴즈!</h2>
                                        <div className="bg-indigo-50 p-12 rounded-[3rem] border-8 border-indigo-100 mb-12">
                                            <p className="text-6xl font-bold text-slate-800 leading-normal keep-word">{bonusQuiz.q}</p>
                                        </div>
                                        <div className="mb-12">
                                            <input type="text" value={bonusInput} onChange={(e) => setBonusInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && checkBonusAnswer()} placeholder="정답을 입력하세요" className="w-full text-5xl p-8 rounded-[2rem] border-8 border-slate-300 text-center focus:border-indigo-500 outline-none" autoFocus />
                                        </div>
                                        <button onClick={checkBonusAnswer} className="w-full bg-gradient-to-r from-yellow-400 to-orange-500 text-white py-10 rounded-[3rem] text-5xl font-black shadow-xl hover:scale-105 transition transform">정답 확인 (+2점)</button>
                                    </div>
                                </div>
                            )}

                            {gameState === 'card' && currentCard && (
                                <div className="absolute inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-10">
                                    <div className="bg-white rounded-[4rem] p-16 max-w-[1400px] w-full text-center shadow-2xl border-[16px] border-indigo-100 pop-in flex flex-col gap-10 max-h-[95vh] overflow-y-auto">
                                        <div className="flex justify-center items-stretch gap-10 mb-4">
                                            <div className="flex-1 bg-slate-50 border-8 border-slate-200 rounded-[3rem] p-10 shadow-inner flex flex-col justify-center min-h-[400px]">
                                                <div className="text-4xl text-slate-500 font-bold mb-8">뉴스 속보 📰</div>
                                                <div className={`text-8xl font-black mb-4 ${currentCard.color}`}>{currentCard.label}</div>
                                                <div className={`text-6xl font-black mb-10 ${currentCard.color}`}>{currentCard.subLabel}</div>
                                                <div className="text-5xl text-slate-700 font-bold leading-snug keep-word">{currentCard.desc}</div>
                                                <div className="text-3xl text-slate-500 mt-8">{currentCard.detail}</div>
                                            </div>
                                            <div className="flex-1 bg-yellow-50 border-8 border-yellow-200 rounded-[3rem] p-10 shadow-inner flex flex-col justify-center min-h-[400px]">
                                                <div className="text-4xl text-yellow-700 font-bold mb-8">현재 우리 팀은?</div>
                                                <div className="text-[10rem] mb-10 animate-pulse filter drop-shadow-xl">{BOARD_TILES[teams[currentTurn].position].scene}</div>
                                                <div className="text-6xl font-black text-slate-800 mb-8">{BOARD_TILES[teams[currentTurn].position].name.split('\n')[0]}</div>
                                                <div className="text-4xl text-slate-600 bg-white/60 p-8 rounded-[2rem] font-bold leading-relaxed whitespace-nowrap">"{BOARD_TILES[teams[currentTurn].position].desc}"</div>
                                            </div>
                                        </div>
                                        <div className="text-6xl font-bold text-slate-900 mb-4">이 상황이 <span className="text-indigo-600 underline decoration-8 underline-offset-8">{BOARD_TILES[teams[currentTurn].position].name.split('\n')[0]}</span>에게 유리할까요?</div>
                                        <div className="grid grid-cols-2 gap-10">
                                            <button onClick={() => checkAnswer('good')} className="bg-blue-100 hover:bg-blue-200 text-blue-700 py-12 rounded-[3rem] text-6xl font-black border-b-[12px] border-blue-300 active:translate-y-4 transition-transform transform hover:scale-[1.02] flex flex-col items-center gap-2"><span>👍</span> <span>유리해요!</span></button>
                                            <button onClick={() => checkAnswer('bad')} className="bg-red-100 hover:bg-red-200 text-red-700 py-12 rounded-[3rem] text-6xl font-black border-b-[12px] border-red-300 active:translate-y-4 transition-transform transform hover:scale-[1.02] flex flex-col items-center gap-2"><span>👎</span> <span>불리해요!</span></button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {gameState === 'result' && feedback && (
                                <div className="absolute inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-10" onClick={nextTurn}>
                                    <div className="bg-white rounded-[4rem] p-16 max-w-5xl w-full text-center shadow-2xl pop-in cursor-pointer border-[16px] border-white ring-8 ring-indigo-200 max-h-[90vh] overflow-y-auto">
                                        <div className="text-[12rem] mb-10 animate-bounce">{feedback.isGood ? '🎉' : '🤔'}</div>
                                        <h2 className="text-8xl font-black mb-8 text-indigo-900">{feedback.result}</h2>
                                        <p className="text-7xl font-bold text-pink-500 mb-12">{feedback.msg}</p>
                                        <div className="bg-slate-100 p-12 rounded-[3rem] text-left text-5xl text-slate-800 font-bold leading-relaxed border-l-[20px] border-indigo-500 shadow-inner">💡 선생님 말씀:<br/><span className="text-4xl font-medium text-slate-600 mt-6 block keep-word">{feedback.desc}</span></div>
                                        <p className="mt-12 text-slate-400 text-3xl animate-pulse">화면을 클릭하면 다음 차례로 넘어갑니다</p>
                                    </div>
                                </div>
                            )}

                            {gameState === 'gameover' && (
                                <div className="absolute inset-0 bg-indigo-900/95 z-50 flex items-center justify-center p-10">
                                    <div className="bg-white rounded-[4rem] p-16 max-w-7xl w-full text-center shadow-2xl pop-in relative overflow-hidden h-[85vh] flex flex-col">
                                        <div className="absolute top-0 left-0 w-full h-10 bg-gradient-to-r from-yellow-400 via-orange-500 to-pink-500"></div>
                                        <h1 className="text-8xl font-black mb-10 text-indigo-900 mt-6">🏆 경기 결과 발표 🏆</h1>
                                        <div className="flex-1 flex items-end justify-center gap-10 pb-12 overflow-x-auto">
                                            {[...teams].sort((a,b) => b.score - a.score)[1] && (
                                                <div className="w-1/4 min-w-[200px] flex flex-col items-center justify-end rise-up" style={{animationDelay: '0.5s'}}>
                                                    <div className="mb-6 text-center">
                                                        <div className="text-8xl mb-4">{[...teams].sort((a,b) => b.score - a.score)[1].icon}</div>
                                                        <div className="text-4xl font-bold text-slate-600 mb-2">{[...teams].sort((a,b) => b.score - a.score)[1].name}</div>
                                                        <div className="text-6xl font-black text-indigo-600">{[...teams].sort((a,b) => b.score - a.score)[1].score}점</div>
                                                    </div>
                                                    <div className="w-full h-72 bg-slate-200 rounded-t-[3rem] flex items-center justify-center border-t-[16px] border-slate-300 text-8xl font-black text-white/50 shadow-inner">2</div>
                                                </div>
                                            )}
                                            {[...teams].sort((a,b) => b.score - a.score)[0] && (
                                                <div className="w-1/3 min-w-[250px] flex flex-col items-center justify-end z-10 rise-up" style={{animationDelay: '0s'}}>
                                                    <div className="mb-6 text-center transform scale-110">
                                                        <div className="text-[10rem] mb-4 animate-bounce">{[...teams].sort((a,b) => b.score - a.score)[0].icon}</div>
                                                        <div className="text-5xl font-bold text-slate-800 mb-2">{[...teams].sort((a,b) => b.score - a.score)[0].name}</div>
                                                        <div className="text-8xl font-black text-yellow-500 drop-shadow-lg">{[...teams].sort((a,b) => b.score - a.score)[0].score}점</div>
                                                    </div>
                                                    <div className="w-full h-96 bg-yellow-400 rounded-t-[3rem] flex items-center justify-center border-t-[16px] border-yellow-300 text-[10rem] font-black text-white/50 shadow-2xl relative"><div className="absolute -top-20 text-[8rem]">👑</div>1</div>
                                                </div>
                                            )}
                                            {[...teams].sort((a,b) => b.score - a.score)[2] && (
                                                <div className="w-1/4 min-w-[200px] flex flex-col items-center justify-end rise-up" style={{animationDelay: '1s'}}>
                                                    <div className="mb-6 text-center">
                                                        <div className="text-8xl mb-4">{[...teams].sort((a,b) => b.score - a.score)[2].icon}</div>
                                                        <div className="text-4xl font-bold text-slate-600 mb-2">{[...teams].sort((a,b) => b.score - a.score)[2].name}</div>
                                                        <div className="text-6xl font-black text-indigo-600">{[...teams].sort((a,b) => b.score - a.score)[2].score}점</div>
                                                    </div>
                                                    <div className="w-full h-48 bg-amber-600 rounded-t-[3rem] flex items-center justify-center border-t-[16px] border-amber-500 text-8xl font-black text-white/50 shadow-inner">3</div>
                                                </div>
                                            )}
                                        </div>
                                        <button onClick={() => window.location.reload()} className="bg-indigo-600 text-white px-20 py-8 rounded-[3rem] text-5xl font-bold hover:bg-indigo-700 transition shadow-2xl flex items-center justify-center gap-6 mx-auto hover:scale-105"><Icons.Refresh /> 새로운 게임 시작</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
