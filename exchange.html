<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>환율 보드게임 (교실용)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f0f4f8; overflow: hidden; }
        
        /* 팝업 효과 */
        .pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 말 이동 부드럽게 */
        .token-transition { transition: all 0.5s ease-in-out; }

        /* --- 3D 주사위 스타일 --- */
        .scene {
            width: 200px;
            height: 200px;
            perspective: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cube {
            width: 100px;
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            transform: translateZ(-50px);
            transition: transform 1s;
        }

        .cube.rolling {
            animation: spinDice 0.5s infinite linear;
        }

        .cube__face {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid #ccc;
            line-height: 100px;
            font-size: 40px;
            font-weight: bold;
            color: #333;
            text-align: center;
            background: white;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 주사위 눈 배치 */
        .cube__face--1  { transform: rotateY(  0deg) translateZ(50px); }
        .cube__face--2  { transform: rotateY( 90deg) translateZ(50px); }
        .cube__face--3  { transform: rotateY(180deg) translateZ(50px); }
        .cube__face--4  { transform: rotateY(-90deg) translateZ(50px); }
        .cube__face--5  { transform: rotateX( 90deg) translateZ(50px); }
        .cube__face--6  { transform: rotateX(-90deg) translateZ(50px); }

        /* 결과에 따른 회전 각도 */
        .show-1 { transform: translateZ(-50px) rotateY(   0deg); }
        .show-2 { transform: translateZ(-50px) rotateY( -90deg); }
        .show-3 { transform: translateZ(-50px) rotateY(-180deg); }
        .show-4 { transform: translateZ(-50px) rotateY(  90deg); }
        .show-5 { transform: translateZ(-50px) rotateX( -90deg); }
        .show-6 { transform: translateZ(-50px) rotateX(  90deg); }

        @keyframes spinDice {
            0% { transform: translateZ(-50px) rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: translateZ(-50px) rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
        }

        /* 주사위 점 그리기 */
        .dot { width: 18px; height: 18px; background: #333; border-radius: 50%; display: inline-block; }
        .face-content { display: grid; width: 100%; height: 100%; padding: 16px; }
        
        /* 주사위 면별 점 배치 */
        .face-1 { display: flex; justify-content: center; align-items: center; }
        .face-2 { display: flex; justify-content: space-between; }
        .face-2 .dot:nth-child(2) { align-self: flex-end; }
        .face-3 { display: flex; justify-content: space-between; }
        .face-3 .dot:nth-child(2) { align-self: center; }
        .face-3 .dot:nth-child(3) { align-self: flex-end; }
        .face-4 { display: flex; flex-wrap: wrap; align-content: space-between; justify-content: space-between; }
        .face-5 { display: flex; flex-wrap: wrap; align-content: space-between; justify-content: space-between; }
        .face-5 .dot:nth-child(1), .face-5 .dot:nth-child(2) { margin-bottom: 4px; } 
        .face-5 { position: relative; }
        .face-5 .dot:nth-child(5) { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); margin:0; }
        .face-6 { display: flex; flex-wrap: wrap; align-content: space-between; justify-content: space-between; }
        .face-6 .dot { margin: 0 4px; } /* 간격 조정 필요시 */
        /* face-6 grid로 재구현 */
        .face-grid-6 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; justify-items: center; align-items: center; height: 100%; width: 100%; padding: 10px; }

    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 아이콘 컴포넌트 ---
        const Icons = {
            Trophy: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17"/><path d="M14 14.66V17"/><path d="M12 22v-5"/><path d="M19 21H5a2 2 0 0 1-2-2V6.82a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2V19a2 2 0 0 1-2 2Z"/></svg>,
            Volume2: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>,
            VolumeX: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>,
            Globe: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>,
            Refresh: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>,
            Flag: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        };

        // --- 3D 주사위 컴포넌트 ---
        const Dice3D = ({ val, isRolling }) => {
            const diceClass = isRolling ? 'rolling' : `show-${val}`;
            
            return (
                <div className="scene">
                    <div className={`cube ${diceClass}`}>
                        <div className="cube__face cube__face--1">
                            <div className="face-1"><div className="dot"></div></div>
                        </div>
                        <div className="cube__face cube__face--2">
                             <div className="face-2"><div className="dot"></div><div className="dot"></div></div>
                        </div>
                        <div className="cube__face cube__face--3">
                             <div className="face-3"><div className="dot"></div><div className="dot"></div><div className="dot"></div></div>
                        </div>
                        <div className="cube__face cube__face--4">
                             <div className="face-4"><div className="dot"></div><div className="dot"></div><div className="dot"></div><div className="dot"></div></div>
                        </div>
                        <div className="cube__face cube__face--5">
                             <div className="face-5"><div className="dot"></div><div className="dot"></div><div className="dot"></div><div className="dot"></div><div className="dot"></div></div>
                        </div>
                        <div className="cube__face cube__face--6">
                             <div className="face-grid-6">
                                 <div className="dot"></div><div className="dot"></div>
                                 <div className="dot"></div><div className="dot"></div>
                                 <div className="dot"></div><div className="dot"></div>
                             </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 데이터 설정 ---

        const TEAM_CONFIG = [
            { id: 0, name: "1팀", icon: "🐯", color: "bg-red-500", border: "border-red-600" },
            { id: 1, name: "2팀", icon: "🐰", color: "bg-blue-500", border: "border-blue-600" },
            { id: 2, name: "3팀", icon: "🐻", color: "bg-green-500", border: "border-green-600" },
            { id: 3, name: "4팀", icon: "🦊", color: "bg-yellow-500", border: "border-yellow-600" },
            { id: 4, name: "5팀", icon: "🐧", color: "bg-purple-500", border: "border-purple-600" },
            { id: 5, name: "6팀", icon: "🐨", color: "bg-pink-500", border: "border-pink-600" },
        ];

        // 효과음
        const SOUNDS = {
            roll: 'https://assets.mixkit.co/active_storage/sfx/2577/2577-preview.mp3',
            move: 'https://assets.mixkit.co/active_storage/sfx/2578/2578-preview.mp3',
            correct: 'https://assets.mixkit.co/active_storage/sfx/2579/2579-preview.mp3',
            wrong: 'https://assets.mixkit.co/active_storage/sfx/2580/2580-preview.mp3',
            win: 'https://assets.mixkit.co/active_storage/sfx/2581/2581-preview.mp3',
        };

        const BOARD_TILES = [
            { id: 0, name: "출발", type: "start", role: "none", icon: "🚩", bg: "bg-green-100" },
            { id: 1, name: "수입업자\n(가구판매)", type: "normal", role: "import", icon: "🛋️", bg: "bg-white" },
            { id: 2, name: "수출업자\n(자동차)", type: "normal", role: "export", icon: "🚗", bg: "bg-white" },
            { id: 3, name: "방한 외국인\n관광객", type: "normal", role: "export", icon: "📸", bg: "bg-white" },
            { id: 4, name: "해외 여행\n가는 한국인", type: "normal", role: "import", icon: "✈️", bg: "bg-white" },
            { id: 5, name: "유학 중인\n한국 학생", type: "normal", role: "import", icon: "🎓", bg: "bg-white" },
            { id: 6, name: "보너스\n게임", type: "bonus", role: "none", icon: "🎁", bg: "bg-yellow-100" },

            { id: 7, name: "유학 온\n외국 학생", type: "normal", role: "export", icon: "🎒", bg: "bg-white" },
            { id: 8, name: "외국계 기업\n한국인(외화월급)", type: "normal", role: "export", icon: "💼", bg: "bg-white" },
            { id: 9, name: "뒤로 가기", type: "back", role: "none", icon: "🔙", bg: "bg-red-100" },

            { id: 10, name: "무인도", type: "island", role: "none", icon: "🏝️", bg: "bg-gray-200" },
            { id: 11, name: "한국 기업\n외국인(원화월급)", type: "normal", role: "import", icon: "👷", bg: "bg-white" },
            { id: 12, name: "달러 투자\n한국인", type: "normal", role: "export", icon: "💰", bg: "bg-white" },
            { id: 13, name: "원화 투자\n외국인", type: "normal", role: "import", icon: "📉", bg: "bg-white" },
            { id: 14, name: "달러 빚\n갚는 한국인", type: "normal", role: "import", icon: "💸", bg: "bg-white" },
            { id: 15, name: "원화 빚\n갚는 외국인", type: "normal", role: "export", icon: "🏦", bg: "bg-white" },

            { id: 16, name: "특별\n휴가", type: "rest", role: "none", icon: "🏖️", bg: "bg-blue-100" },
            { id: 17, name: "기러기\n아빠", type: "normal", role: "import", icon: "👨‍👧‍👦", bg: "bg-white" },
        ];

        const SITUATION_CARDS = [
            { type: "UP", label: "환율 상승 📈\n(원화 약세)", desc: "1달러가 1000원 ➔ 1500원!", color: "text-red-600" },
            { type: "DOWN", label: "환율 하락 📉\n(원화 강세)", desc: "1달러가 1500원 ➔ 1000원!", color: "text-blue-600" },
        ];

        // --- 메인 앱 ---
        const App = () => {
            const [setupMode, setSetupMode] = useState(true);
            const [teamCount, setTeamCount] = useState(2);
            const [teams, setTeams] = useState([]);
            const [currentTurn, setCurrentTurn] = useState(0);
            const [gameState, setGameState] = useState('ready');
            const [diceVal, setDiceVal] = useState(1);
            const [currentCard, setCurrentCard] = useState(null);
            const [feedback, setFeedback] = useState(null);
            const [history, setHistory] = useState(["게임을 시작합니다!"]);
            const [isMuted, setIsMuted] = useState(false);
            const audioRef = useRef(null);

            const playSound = (key) => {
                if (!isMuted && audioRef.current) {
                    audioRef.current.src = SOUNDS[key];
                    audioRef.current.play().catch(e => console.log('Sound play error'));
                }
            };

            const addLog = (msg) => setHistory(prev => [msg, ...prev].slice(0, 1));

            const startGame = () => {
                const newTeams = Array.from({ length: teamCount }, (_, i) => ({
                    ...TEAM_CONFIG[i],
                    position: 0,
                    score: 0,
                    isStuck: false
                }));
                setTeams(newTeams);
                setSetupMode(false);
            };

            // 수동 게임 종료 함수
            const finishGame = () => {
                setGameState('gameover');
                playSound('win');
            };

            const rollDice = () => {
                if (gameState !== 'ready') return;
                
                if (teams[currentTurn].isStuck) {
                    addLog(`${teams[currentTurn].name}: 무인도에서 휴식 중...`);
                    setTeams(prev => prev.map((t, i) => i === currentTurn ? { ...t, isStuck: false } : t));
                    setTimeout(nextTurn, 1500);
                    return;
                }

                setGameState('rolling');
                playSound('roll');
                
                // 주사위 굴리기 애니메이션
                let count = 0;
                const interval = setInterval(() => {
                    count++;
                    if (count > 25) { 
                        clearInterval(interval);
                        const final = Math.ceil(Math.random() * 6);
                        setDiceVal(final);
                        setGameState('rolled');
                        setTimeout(() => handleMove(final), 800); 
                    }
                }, 80);
            };

            const handleMove = (steps) => {
                setGameState('moving');
                playSound('move');

                const activeTeam = teams[currentTurn];
                let nextPos = activeTeam.position + steps;
                let looped = false;

                if (nextPos >= BOARD_TILES.length) {
                    nextPos = nextPos % BOARD_TILES.length;
                    looped = true;
                }

                setTeams(prev => prev.map((t, i) => i === currentTurn ? { ...t, position: nextPos } : t));

                setTimeout(() => {
                    if (looped) {
                        addLog(`🎉 출발점 통과! +5점`);
                        updateScore(5);
                        playSound('correct');
                    }

                    const tile = BOARD_TILES[nextPos];
                    
                    if (tile.type === 'back') {
                        addLog("🔙 뒤로 가기 (2칸 후퇴)");
                        let backPos = nextPos - 2;
                        if (backPos < 0) backPos = BOARD_TILES.length + backPos;
                        
                        setTimeout(() => {
                            setTeams(prev => prev.map((t, i) => i === currentTurn ? { ...t, position: backPos } : t));
                            playSound('move');
                            setTimeout(nextTurn, 1000);
                        }, 1000);

                    } else if (tile.type === 'island') {
                        addLog("🏝️ 무인도! 다음 턴 쉽니다.");
                        setTeams(prev => prev.map((t, i) => i === currentTurn ? { ...t, isStuck: true } : t));
                        setTimeout(nextTurn, 1500);
                    } else if (tile.type === 'rest') {
                        addLog("🏖️ 특별 휴가!");
                        setTimeout(nextTurn, 1500);
                    } else if (tile.type === 'bonus') {
                        addLog("🎁 보너스! +2점");
                        updateScore(2);
                        playSound('correct');
                        setTimeout(nextTurn, 1500);
                    } else if (tile.type === 'start') {
                        setTimeout(nextTurn, 1000);
                    } else {
                        setGameState('card');
                        const card = SITUATION_CARDS[Math.floor(Math.random() * SITUATION_CARDS.length)];
                        setCurrentCard(card);
                    }
                }, 1000);
            };

            const updateScore = (points) => {
                setTeams(prev => prev.map((t, i) => {
                    if (i === currentTurn) {
                        return { ...t, score: t.score + points };
                    }
                    return t;
                }));
            };

            const checkAnswer = (choice) => {
                const activeTeam = teams[currentTurn];
                const tile = BOARD_TILES[activeTeam.position];
                const card = currentCard;

                let isFavorable = false;
                let explanation = "";

                if (tile.role === 'export') {
                    if (card.type === 'UP') {
                        isFavorable = true;
                        explanation = "환율 상승! 달러를 원화로 바꿀 때 이득! 👍";
                    } else {
                        isFavorable = false;
                        explanation = "환율 하락! 달러를 원화로 바꿀 때 손해! 😭";
                    }
                } else if (tile.role === 'import') {
                    if (card.type === 'UP') {
                        isFavorable = false;
                        explanation = "환율 상승! 달러 살 때 돈이 더 들어요. 💸";
                    } else {
                        isFavorable = true;
                        explanation = "환율 하락! 달러를 싸게 살 수 있어요! 👍";
                    }
                }

                const correct = (choice === 'good' && isFavorable) || (choice === 'bad' && !isFavorable);

                if (correct) {
                    setFeedback({ result: "정답! ⭕", msg: "+1점", desc: explanation, isGood: true });
                    updateScore(1);
                    playSound('correct');
                } else {
                    setFeedback({ result: "땡! ❌", msg: "점수 없음", desc: explanation, isGood: false });
                    playSound('wrong');
                }
                setGameState('result');
            };

            const nextTurn = () => {
                setFeedback(null);
                setCurrentCard(null);
                setGameState('ready');
                setCurrentTurn(prev => (prev + 1) % teams.length);
            };

            const getGridStyle = (idx) => {
                let col, row;
                if (idx <= 6) { // Top row
                    col = idx + 1; row = 1;
                } else if (idx <= 8) { // Right col
                    col = 7; row = idx - 5;
                } else if (idx <= 15) { // Bottom row
                    col = 7 - (idx - 9); row = 4;
                } else { // Left col
                    col = 1; row = 4 - (idx - 15);
                }
                return { gridColumn: col, gridRow: row };
            };

            // --- 렌더링 ---
            if (setupMode) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-indigo-900 text-white p-4">
                        <div className="bg-white/10 backdrop-blur-lg p-10 rounded-3xl shadow-2xl text-center border border-white/20 max-w-xl w-full">
                            <h1 className="text-4xl font-black mb-2 text-yellow-400 drop-shadow-lg flex items-center justify-center gap-2">
                                <Icons.Globe /> 환율 보드게임
                            </h1>
                            <p className="text-lg text-indigo-200 mb-8">교실 대항전 모드</p>
                            
                            <div className="mb-8">
                                <label className="block text-xl font-bold mb-4">참여 팀 수</label>
                                <div className="flex justify-center gap-3">
                                    {[2, 3, 4, 5, 6].map(num => (
                                        <button
                                            key={num}
                                            onClick={() => setTeamCount(num)}
                                            className={`w-14 h-14 rounded-xl text-2xl font-bold transition-all ${teamCount === num ? 'bg-yellow-400 text-indigo-900 scale-110 shadow-lg ring-4 ring-yellow-200' : 'bg-indigo-800 hover:bg-indigo-700'}`}
                                        >
                                            {num}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            <button onClick={startGame} className="w-full bg-gradient-to-r from-pink-500 to-orange-500 hover:from-pink-600 hover:to-orange-600 py-5 rounded-2xl text-2xl font-black shadow-xl transition transform active:scale-95">
                                게임 시작 🚀
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-screen flex flex-col bg-[#e0f7fa] overflow-hidden relative select-none">
                    <audio ref={audioRef} className="hidden" />

                    {/* 상단 점수판 */}
                    <div className="bg-white shadow-md p-2 flex justify-between items-center z-10 px-4 h-16">
                        <div className="flex items-center gap-2">
                             <button 
                                onClick={finishGame}
                                className="bg-red-500 hover:bg-red-600 text-white px-4 py-1.5 rounded-lg font-bold text-sm md:text-base shadow-sm active:scale-95 transition flex items-center gap-2"
                             >
                                <Icons.Flag /> 경기 종료
                             </button>
                             <button onClick={() => setIsMuted(!isMuted)} className="text-slate-400 hover:text-slate-600">
                                {isMuted ? <Icons.VolumeX /> : <Icons.Volume2 />}
                            </button>
                        </div>
                        <div className="flex gap-2 overflow-x-auto items-center no-scrollbar">
                            {teams.map((team, idx) => (
                                <div key={idx} className={`flex items-center gap-1 px-3 py-1 rounded-full border-2 transition-all ${idx === currentTurn ? 'bg-yellow-50 border-yellow-400 scale-105 shadow-md ring-2 ring-yellow-200' : 'bg-slate-50 border-slate-200 opacity-60'}`}>
                                    <span className="text-xl">{team.icon}</span>
                                    <span className="font-bold text-slate-700 text-sm">{team.name}</span>
                                    <span className="bg-slate-800 text-white px-2 rounded text-sm font-mono">{team.score}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* 게임 보드 */}
                    <div className="flex-1 p-2 relative flex items-center justify-center">
                        <div className="w-full max-w-[1400px] aspect-[16/9] grid grid-cols-7 grid-rows-4 gap-1 md:gap-2 relative">
                            
                            {/* 중앙 정보판 */}
                            <div className="col-start-2 col-end-7 row-start-2 row-end-4 bg-white/60 rounded-3xl flex flex-col items-center justify-center border-4 border-dashed border-indigo-200 relative">
                                <div className="absolute inset-0 flex items-center justify-center opacity-10 pointer-events-none">
                                    <Icons.Globe />
                                </div>
                                <h1 className="text-3xl md:text-5xl font-black text-indigo-900 tracking-tight mb-2 z-10">환율 보드게임</h1>
                                <div className="bg-white/80 px-6 py-2 rounded-full shadow-sm z-10 border border-indigo-100">
                                    <span className="text-lg md:text-xl font-bold text-slate-700 animate-pulse">
                                        📢 {history[0]}
                                    </span>
                                </div>
                            </div>

                            {/* 칸 렌더링 */}
                            {BOARD_TILES.map((tile, idx) => (
                                <div 
                                    key={idx}
                                    style={getGridStyle(idx)}
                                    className={`relative border-2 md:border-4 rounded-xl flex flex-col items-center justify-center text-center p-1 shadow-sm transition-colors ${tile.bg} ${idx === teams[currentTurn].position ? 'border-yellow-400 bg-yellow-50 ring-2 ring-yellow-200' : 'border-slate-300'}`}
                                >
                                    <div className="text-2xl md:text-3xl mb-1">{tile.icon}</div>
                                    <div className="font-bold text-[10px] md:text-xs text-slate-800 break-keep leading-tight">{tile.name}</div>
                                    
                                    {/* 말 표시 */}
                                    <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                        <div className="grid grid-cols-2 gap-0.5 md:gap-1 p-1 w-full h-full content-center justify-items-center">
                                            {teams.map((team, tIdx) => (
                                                team.position === idx && (
                                                    <div key={tIdx} className={`w-6 h-6 md:w-10 md:h-10 rounded-full shadow-lg flex items-center justify-center text-sm md:text-xl border-2 border-white token-transition ${team.color} z-10`} style={{ transform: tIdx === currentTurn ? 'scale(1.2) translateY(-5px)' : 'scale(1)' }}>
                                                        {team.icon}
                                                    </div>
                                                )
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* 하단 컨트롤 (Roll Button) */}
                    <div className="absolute bottom-4 left-1/2 -translate-x-1/2 z-20">
                        {gameState === 'ready' && (
                             <button 
                                onClick={rollDice}
                                className={`flex flex-col items-center justify-center w-24 h-24 md:w-32 md:h-32 rounded-full shadow-2xl border-4 md:border-8 border-white transition-transform hover:scale-105 active:scale-95 ${teams[currentTurn].color} animate-bounce`}
                            >
                                <span className="text-3xl md:text-4xl mb-1">🎲</span>
                                <span className="text-white font-black text-sm md:text-lg">굴리기</span>
                            </button>
                        )}
                    </div>

                    {/* --- 오버레이 화면들 --- */}

                    {/* 1. 주사위 굴리는 화면 (3D 주사위) */}
                    {(gameState === 'rolling' || gameState === 'rolled') && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center">
                            <div className="text-center pop-in flex flex-col items-center">
                                <div className="text-white text-2xl font-bold mb-10">{teams[currentTurn].name} 차례!</div>
                                <Dice3D val={diceVal} isRolling={gameState === 'rolling'} />
                                {gameState === 'rolled' && <div className="mt-12 text-5xl font-black text-yellow-400 animate-bounce">{diceVal}</div>}
                            </div>
                        </div>
                    )}

                    {/* 2. 카드 등장 */}
                    {gameState === 'card' && currentCard && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 md:p-8 max-w-lg w-full text-center shadow-2xl border-8 border-indigo-100 pop-in">
                                <h2 className="text-xl md:text-2xl font-bold text-slate-500 mb-4">🔔 상황 발생!</h2>
                                <div className="bg-slate-50 border-2 border-slate-200 rounded-2xl p-6 mb-6">
                                    <div className={`text-2xl md:text-4xl font-black mb-2 ${currentCard.color}`}>{currentCard.label}</div>
                                    <p className="text-lg md:text-xl text-slate-600">{currentCard.desc}</p>
                                </div>
                                <div className="text-xl md:text-2xl font-bold text-slate-800 mb-6 bg-yellow-100 py-4 rounded-xl shadow-sm">
                                    {teams[currentTurn].icon} <span className="text-indigo-700 underline underline-offset-4 decoration-4 decoration-indigo-300">
                                        {BOARD_TILES[teams[currentTurn].position].name.replace('\n', ' ')}
                                    </span>에게 유리할까요?
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <button onClick={() => checkAnswer('good')} className="bg-blue-100 hover:bg-blue-200 text-blue-700 py-4 md:py-6 rounded-2xl text-xl md:text-2xl font-bold border-b-4 border-blue-300 active:translate-y-1">
                                        👍 유리해요
                                    </button>
                                    <button onClick={() => checkAnswer('bad')} className="bg-red-100 hover:bg-red-200 text-red-700 py-4 md:py-6 rounded-2xl text-xl md:text-2xl font-bold border-b-4 border-red-300 active:translate-y-1">
                                        👎 불리해요
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 3. 결과 화면 */}
                    {gameState === 'result' && feedback && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={nextTurn}>
                            <div className="bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl pop-in cursor-pointer border-4 border-white">
                                <div className="text-6xl md:text-8xl mb-4">{feedback.isGood ? '🎉' : '💥'}</div>
                                <h2 className="text-3xl md:text-4xl font-black mb-2 text-indigo-900">{feedback.result}</h2>
                                <p className="text-xl md:text-2xl font-bold text-pink-500 mb-6">{feedback.msg}</p>
                                <div className="bg-slate-100 p-4 rounded-xl text-left text-base md:text-lg text-slate-700 font-medium">
                                    💡 {feedback.desc}
                                </div>
                                <p className="mt-6 text-slate-400 text-sm animate-pulse">화면을 클릭하면 넘어갑니다</p>
                            </div>
                        </div>
                    )}

                    {/* 4. 최종 결과 순위표 */}
                    {gameState === 'gameover' && (
                        <div className="fixed inset-0 bg-indigo-900/95 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2rem] p-8 max-w-2xl w-full text-center shadow-2xl pop-in overflow-hidden relative">
                                <div className="absolute top-0 left-0 w-full h-4 bg-gradient-to-r from-yellow-400 via-orange-500 to-pink-500"></div>
                                <div className="mx-auto text-yellow-400 mb-4 animate-bounce w-20 h-20"><Icons.Trophy /></div>
                                <h1 className="text-4xl md:text-5xl font-black mb-8 text-indigo-900">최종 순위 발표</h1>
                                
                                <div className="grid gap-3 mb-8 overflow-y-auto max-h-[50vh]">
                                    {[...teams].sort((a, b) => b.score - a.score).map((team, idx) => (
                                        <div key={idx} className={`flex items-center justify-between p-4 rounded-xl border-2 ${idx === 0 ? 'bg-yellow-50 border-yellow-400 scale-[1.02] shadow-lg ring-4 ring-yellow-100 z-10' : 'bg-slate-50 border-slate-200'}`}>
                                            <div className="flex items-center gap-4">
                                                <div className={`w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center text-xl md:text-2xl font-bold text-white ${idx === 0 ? 'bg-yellow-400' : idx === 1 ? 'bg-slate-300' : idx === 2 ? 'bg-amber-600' : 'bg-slate-200 text-slate-500'}`}>
                                                    {idx + 1}
                                                </div>
                                                <div className="flex flex-col items-start">
                                                    <span className="text-2xl md:text-3xl">{team.icon}</span>
                                                </div>
                                                <span className="font-bold text-lg md:text-xl text-slate-700">{team.name}</span>
                                            </div>
                                            <div className="text-2xl md:text-3xl font-black text-indigo-600">{team.score}점</div>
                                        </div>
                                    ))}
                                </div>

                                <button onClick={() => window.location.reload()} className="w-full bg-indigo-600 text-white py-4 rounded-xl text-xl font-bold hover:bg-indigo-700 transition flex items-center justify-center gap-2 shadow-lg">
                                    <Icons.Refresh /> 새로운 게임 시작
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
