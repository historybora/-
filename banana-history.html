<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>도전! 바나나 히스토리 V9 (지도 풀세트)</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Nanum+Gothic:wght@700;800&display=swap" rel="stylesheet">
  <!-- D3 & TopoJSON -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>

  <style>
    :root{
      --bg-app:#fffde7;
      --primary:#fbc02d;
      --secondary:#e65100;
      --text:#3e2723;

      --sea:#b3e5fc;
      --paper:#fff9c4;

      --font-title:'Jua', sans-serif;
      --font-body:'Jua', sans-serif;

      --shadow: 0 10px 25px rgba(0,0,0,.18);
      --stroke: #5d4037;
    }

    *{box-sizing:border-box;}
    html,body{height:100%;}
    body{
      margin:0;
      background:var(--bg-app);
      font-family:var(--font-body);
      overflow:hidden;
      user-select:none;
    }

    /* ===== Main Menu ===== */
    #main-menu{
      position:absolute; inset:0;
      background: var(--paper);
      background-image: radial-gradient(#fff176 10%, transparent 10%);
      background-size: 22px 22px;
      z-index:999;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:20px;
      transition: transform .5s ease;
    }
    .title-box{width:100%; text-align:center; margin-bottom:18px;}
    .main-title{
      font-family:var(--font-title);
      font-size: clamp(2.1rem, 7vw, 3.0rem);
      color:var(--secondary);
      text-shadow: 3px 3px 0 #fff;
      margin: 0;
      line-height: 1.05;
      /* ✅ 오른쪽 잘림 해결: 줄바꿈 허용 + 패딩 */
      padding: 0 10px;
      word-break: keep-all;
    }
    .sub-title{
      font-size:1.35rem;
      color:#5d4037;
      margin-top:10px;
      background:white;
      display:inline-block;
      padding:8px 24px;
      border-radius:30px;
      border:3px solid #8d6e63;
      font-weight:bold;
    }

    .nano-banana-svg{
      width:140px;
      height:auto;
      margin-bottom:10px;
      filter: drop-shadow(0 8px 8px rgba(0,0,0,0.2));
      animation: float 2.5s ease-in-out infinite;
    }
    @keyframes float{0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)}}

    .menu-container{display:flex; flex-direction:column; gap:14px; margin:18px 0 32px;}
    .menu-btn{
      width:min(320px, 92vw);
      padding:16px 14px;
      background:white;
      border:4px solid var(--text);
      border-radius:20px;
      font-family:var(--font-title);
      font-size:1.5rem;
      color:var(--text);
      cursor:pointer;
      box-shadow: 6px 6px 0 var(--primary);
      transition: transform .08s;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }
    .menu-btn:active{transform: translate(4px,4px); box-shadow:2px 2px 0 var(--primary);}
    .footer-credit{
      position:absolute;
      bottom:22px;
      color:#8d6e63;
      font-size:1.05rem;
      font-weight:bold;
      background: rgba(255,255,255,.65);
      padding:6px 14px;
      border-radius:15px;
    }

    /* ===== App Screen Layout ===== */
    #app-screen{
      display:none;
      position:absolute; inset:0;
      flex-direction:column;
      background:var(--bg-app);
    }
    header{
      height:56px;
      background:white;
      padding:0 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:4px solid #f9a825;
      flex-shrink:0;
      z-index:60;
    }
    .home-btn{
      font-size:1.8rem;
      cursor:pointer;
      background:none;border:none;
      padding:6px 10px;
      border-radius:12px;
    }
    .home-btn:active{background:#f5f5f5;}
    .page-title{
      font-family:var(--font-title);
      font-size:1.55rem;
      color:var(--text);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:60vw;
      text-align:center;
    }

    /* ✅ 지도 영역: 남는 하늘색 여백 해결 (map-container가 화면을 꽉 차도록) */
    #map-container{
      position:relative;
      flex:1;
      min-height:0; /* 핵심 */
      background:var(--sea);
      overflow:hidden;
    }
    #map-svg{
      width:100%;
      height:100%;
      display:block;
      background:transparent;
      touch-action: pan-x pan-y; /* zoom은 d3로 */
    }
    #loading-msg{
      position:absolute;
      top:50%; left:50%;
      transform:translate(-50%,-50%);
      font-size:1.4rem;
      color:#0277bd;
      font-family:var(--font-title);
      text-align:center;
      pointer-events:none;
      z-index:10;
      background: rgba(255,255,255,.55);
      padding:10px 14px;
      border-radius:14px;
      border:2px solid rgba(0,0,0,.08);
    }

    /* Banana guide */
    #banana-guide{
      position:absolute;
      bottom:18px; right:10px;
      z-index:100;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      pointer-events:none;
    }
    .bubble{
      background:white;
      border:4px solid var(--text);
      border-radius:24px 24px 6px 24px;
      padding:14px 16px;
      margin-bottom:10px;
      width:min(320px, 85vw);
      font-size:1.15rem;
      line-height:1.35;
      color:var(--text);
      box-shadow: var(--shadow);
      pointer-events:auto;
      opacity:0;
      transform: translateY(10px);
      transition: all .25s ease;
    }
    .bubble.show{opacity:1; transform: translateY(0);}

    /* Footer UI */
    footer{
      background:white;
      padding:12px 14px 16px;
      border-top:2px solid #ddd;
      box-shadow: 0 -5px 15px rgba(0,0,0,0.08);
      flex-shrink:0;
      z-index:70;
    }

    /* Explore UI */
    #ui-explore{display:flex; flex-direction:column; gap:10px;}
    .row{
      display:flex;
      align-items:center;
      gap:10px;
      justify-content:space-between;
      flex-wrap:nowrap;
    }
    .badge-era{
      background:var(--text);
      color:var(--primary);
      font-family:var(--font-title);
      font-size:1.15rem;
      padding:8px 10px;
      border-radius:12px;
      min-width:120px;
      text-align:center;
      box-shadow: 3px 3px 0 rgba(0,0,0,.25);
      flex-shrink:0;
    }
    .badge-year{
      background:#eee;
      color:#37474f;
      font-family:'Nanum Gothic', sans-serif;
      font-weight:800;
      font-size:.95rem;
      padding:8px 10px;
      border-radius:12px;
      border:2px solid rgba(0,0,0,.08);
      flex-shrink:0;
      white-space:nowrap;
    }
    input[type=range]{
      flex:1;
      height:22px;
      border-radius:11px;
      background:#e0e0e0;
      accent-color:var(--secondary);
      cursor:pointer;
      border:2px solid #bdbdbd;
      min-width:80px;
    }

    /* ✅ 궁금해요 버튼 잘림 해결: 크기+패딩+footer overflow 확인 */
    .icon-btn{
      width:48px;
      height:48px;
      border-radius:50%;
      border:none;
      flex-shrink:0;
      cursor:pointer;
      font-family:var(--font-title);
      font-size:1.3rem;
      color:white;
      box-shadow: 0 4px 0 #01579b;
      display:grid;
      place-items:center;
    }
    .icon-btn:active{transform: translateY(3px); box-shadow:0 1px 0 #01579b;}
    .btn-qna{background:#0288d1;}
    .btn-search{background:#43a047; box-shadow: 0 4px 0 #1b5e20;}
    .btn-search:active{box-shadow:0 1px 0 #1b5e20;}
    .btn-layer{background:#8e24aa; box-shadow: 0 4px 0 #4a148c;}
    .btn-layer:active{box-shadow:0 1px 0 #4a148c;}

    /* Quiz UI */
    #ui-quiz{display:none; text-align:center;}
    .quiz-q-box{
      background:#fff3e0;
      border:3px solid var(--secondary);
      border-radius:15px;
      padding:12px;
      margin-bottom:10px;
      font-size:1.18rem;
      color:#d84315;
      font-weight:bold;
    }
    .quiz-opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
    .quiz-btn{
      background:white;
      border:2px solid #aaa;
      border-radius:12px;
      padding:12px 10px;
      font-size:1.05rem;
      cursor:pointer;
      color:#444;
      font-family:var(--font-body);
      min-height:46px;
    }
    .quiz-btn:active{background:#eee;}
    .quiz-meta{
      display:flex; justify-content:space-between; gap:10px;
      font-family:'Nanum Gothic', sans-serif;
      font-weight:800;
      color:#37474f;
      margin-top:10px;
      font-size:.92rem;
      opacity:.9;
    }

    /* Modals */
    .modal-overlay{
      position:absolute; inset:0;
      background: rgba(0,0,0,0.7);
      z-index:500;
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
    }
    .popup-box{
      background:white;
      border:5px solid var(--stroke);
      border-radius:20px;
      width:100%;
      max-width:520px;
      max-height:82vh;
      overflow:auto;
      padding:18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      position:relative;
    }
    .popup-title{
      margin:0 0 12px;
      font-family:var(--font-title);
      color:#1565c0;
      text-align:center;
      font-size:1.6rem;
    }
    .close-btn{
      width:100%;
      padding:12px;
      border:none;
      border-radius:12px;
      font-family:var(--font-title);
      font-size:1.15rem;
      cursor:pointer;
      background:#1976d2;
      color:white;
      margin-top:12px;
    }

    /* Stamp board */
    .stamp-wrap{background:#fff8e1;}
    .stamp-title{color:#e65100;}
    .stamp-grid{display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; margin-top:12px;}
    .stamp-slot{
      aspect-ratio: 1 / 1;
      border: 2px dashed #bbb;
      border-radius: 12px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:#fffde7;
      position:relative;
      overflow:hidden;
    }
    .stamp-slot.stamped{border:2px solid #fbc02d; background:#fff9c4;}
    .stamp-slot-num{font-size:.9rem; color:#777; margin-bottom:4px;}
    .stamp-mark{
      font-size:2rem;
      opacity:0;
      transform: scale(3) rotate(-28deg);
      transition: all .38s cubic-bezier(.18,.88,.32,1.27);
    }
    .stamp-slot.stamped .stamp-mark{opacity:1; transform: scale(1) rotate(0deg);}
    .path-row{
      margin-top:12px;
      display:flex;
      align-items:center;
      gap:10px;
      justify-content:center;
      font-family:var(--font-title);
      color:#5d4037;
    }
    .path-chip{
      padding:8px 12px;
      border-radius:999px;
      border:3px solid #8d6e63;
      background:white;
      box-shadow: 3px 3px 0 rgba(0,0,0,.15);
      font-size:1.05rem;
    }

    /* Certificate + Report */
    .cert-box{
      background: linear-gradient(180deg, #fffde7, #fff8e1);
      border:10px solid #fbc02d;
      border-radius:20px;
      padding:18px;
      text-align:center;
    }
    .cert-title{
      font-family:'Black Han Sans', sans-serif;
      font-size:2rem;
      color:#e65100;
      margin:8px 0 10px;
      text-decoration: underline;
      text-underline-offset: 8px;
    }
    .cert-name{
      font-family:var(--font-title);
      font-size:1.35rem;
      color:#3e2723;
      margin:6px 0 12px;
    }
    .cert-body{
      font-size:1.08rem;
      line-height:1.55;
      color:#3e2723;
      margin-bottom:14px;
    }
    .report-card{
      text-align:left;
      background:white;
      border:3px solid rgba(0,0,0,.12);
      border-radius:14px;
      padding:12px;
      margin:12px 0;
      box-shadow: 0 6px 18px rgba(0,0,0,.08);
      font-family:'Nanum Gothic', sans-serif;
      font-weight:800;
      color:#37474f;
      font-size:.95rem;
      white-space:pre-wrap;
    }
    .cert-actions{display:flex; gap:10px; margin-top:10px;}
    .action-btn{
      flex:1;
      padding:12px 10px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-family:var(--font-title);
      font-size:1.1rem;
      color:white;
    }
    .btn-home{background:#e65100;}
    .btn-copy{background:#2e7d32;}
    .btn-home:active,.btn-copy:active{filter:brightness(.92);}

    /* Map labels */
    .label-txt{
      font-family: var(--font-title);
      font-size: 20px;
      fill:#37474f;
      text-anchor: middle;
      paint-order: stroke;
      stroke: white;
      stroke-width: 5px;
      pointer-events:none;
      font-weight: normal;
    }
    .pin-label{
      font-family:'Nanum Gothic', sans-serif;
      font-weight:800;
      font-size:14px;
      fill:#212121;
      paint-order: stroke;
      stroke:white;
      stroke-width:4px;
      pointer-events:none;
    }
    .river-path{fill:none; stroke:#29b6f6; stroke-width:3px; opacity:.9; stroke-linecap:round;}
    .route-path{fill:none; stroke-width:5px; opacity:.92; stroke-linecap:round;}
    .route-label{
      font-family:'Nanum Gothic', sans-serif;
      font-weight:800;
      font-size:12px;
      fill:#263238;
      paint-order: stroke;
      stroke:white;
      stroke-width:4px;
      pointer-events:none;
    }
    .highlight-ring{
      fill:none;
      stroke:#ff1744;
      stroke-width:6px;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,.25));
    }
  </style>
</head>

<body>
  <!-- ===== Main Menu ===== -->
  <div id="main-menu">
    <svg class="nano-banana-svg" viewBox="0 0 140 170" id="main-banana">
      <g transform="translate(0, 10)">
        <path d="M30,35 L110,35 L100,5 L40,5 Z" fill="#212121"/>
        <ellipse cx="70" cy="35" rx="45" ry="5" fill="#212121"/>
        <path d="M35,35 Q70,90 105,35" fill="none" stroke="#212121" stroke-width="3" opacity="0.8"/>
      </g>
      <g transform="translate(0, 40)">
        <path d="M70,0 C105,0 125,40 115,100 C105,130 65,135 35,110 C10,80 35,0 70,0 Z" fill="#fdd835" stroke="#fbc02d" stroke-width="4"/>
        <g id="face-normal">
          <circle cx="55" cy="50" r="5" fill="#3e2723"/><circle cx="95" cy="50" r="5" fill="#3e2723"/>
          <path d="M60,65 Q75,80 90,65" fill="none" stroke="#3e2723" stroke-width="4" stroke-linecap="round"/>
        </g>
        <ellipse cx="45" cy="60" rx="6" ry="4" fill="#ff8a80" opacity="0.6"/>
        <ellipse cx="105" cy="60" rx="6" ry="4" fill="#ff8a80" opacity="0.6"/>
      </g>
    </svg>

    <div class="title-box">
      <h1 class="main-title">도전! 바나나 히스토리</h1>
      <div class="sub-title">한국사편</div>
    </div>

    <div class="menu-container">
      <div class="menu-btn" onclick="App.start('explore')">🌏 역사 탐험 모드</div>
      <div class="menu-btn" onclick="App.start('quiz')">⚔️ Stage 도전!</div>
    </div>

    <div class="footer-credit">💜 보라쌤과 역사를 보라</div>
  </div>

  <!-- ===== App Screen ===== -->
  <div id="app-screen">
    <header>
      <button class="home-btn" onclick="App.goHome()">🏠</button>
      <div class="page-title" id="header-txt">역사 탐험</div>
      <div style="width:44px"></div>
    </header>

    <div id="map-container">
      <div id="loading-msg">지도를 펼치는 중... 🍌</div>
      <svg id="map-svg"></svg>

      <div id="banana-guide">
        <div class="bubble" id="banana-msg">안녕! 나노바나나야! 🍌</div>
        <svg width="96" height="115" viewBox="0 0 140 170">
          <use href="#main-banana"></use>
        </svg>
      </div>
    </div>

    <footer>
      <!-- Explore UI -->
      <div id="ui-explore">
        <div class="row">
          <div class="badge-era" id="era-badge">고조선</div>
          <div class="badge-year" id="year-badge">기원전~</div>
        </div>

        <div class="row">
          <input type="range" id="era-slider" min="0" max="0" step="1" value="0"/>
          <button class="icon-btn btn-search" onclick="App.openSearch()">🔎</button>
          <button class="icon-btn btn-layer" onclick="App.openLayer()">🗺️</button>
          <button class="icon-btn btn-qna" onclick="App.openQna()">❓</button>
        </div>
      </div>

      <!-- Quiz UI -->
      <div id="ui-quiz">
        <div class="quiz-q-box" id="quiz-question">문제 로딩중...</div>
        <div class="quiz-opt-grid" id="quiz-options"></div>
        <div class="quiz-meta">
          <div id="quiz-stage-meta">Stage 1</div>
          <div id="quiz-score-meta">정답 0 / 오답 0</div>
        </div>
      </div>
    </footer>
  </div>

  <!-- ===== Modals ===== -->
  <!-- QnA -->
  <div class="modal-overlay" id="qna-modal" onclick="if(event.target===this) App.closeQna()">
    <div class="popup-box" style="background:#e3f2fd;">
      <h2 class="popup-title">💡 선생님, 궁금해요!</h2>
      <div id="qna-list"></div>
      <button class="close-btn" onclick="App.closeQna()">닫기</button>
    </div>
  </div>

  <!-- Search -->
  <div class="modal-overlay" id="search-modal" onclick="if(event.target===this) App.closeSearch()">
    <div class="popup-box">
      <h2 class="popup-title" style="color:#2e7d32;">🔎 찾기(지명/사건)</h2>
      <input id="search-input" placeholder="예) 한산도 / 병인양요 / 대동법 / 개경 / 우금치" style="
        width:100%; padding:12px 12px; border-radius:12px; border:2px solid rgba(0,0,0,.15);
        font-family:'Nanum Gothic', sans-serif; font-weight:800; font-size:1rem;
      "/>
      <div id="search-results" style="margin-top:12px; display:flex; flex-direction:column; gap:8px;"></div>
      <button class="close-btn" onclick="App.closeSearch()" style="background:#2e7d32;">닫기</button>
    </div>
  </div>

  <!-- Layer -->
  <div class="modal-overlay" id="layer-modal" onclick="if(event.target===this) App.closeLayer()">
    <div class="popup-box">
      <h2 class="popup-title" style="color:#6a1b9a;">🗺️ 표시 레이어</h2>
      <div style="display:flex; flex-direction:column; gap:10px; font-family:'Nanum Gothic',sans-serif; font-weight:800;">
        <label><input type="checkbox" id="layer-territory" checked/> 영토/권역(근사 폴리곤)</label>
        <label><input type="checkbox" id="layer-routes" checked/> 이동/진격/침입 경로</label>
        <label><input type="checkbox" id="layer-pins" checked/> 핀(도시/전투/유적)</label>
        <label><input type="checkbox" id="layer-labels" checked/> 지도 글자(국가명)</label>
      </div>
      <button class="close-btn" onclick="App.applyLayer()">적용</button>
      <button class="close-btn" onclick="App.closeLayer()" style="background:#6a1b9a;">닫기</button>
    </div>
  </div>

  <!-- Stamp -->
  <div class="modal-overlay" id="stamp-modal">
    <div class="popup-box stamp-wrap">
      <h2 class="popup-title stamp-title">📒 나의 도장판</h2>
      <div class="path-row">
        <span class="path-chip" id="path-chip">🌿 길을 따라 전진!</span>
        <span class="path-chip" id="stage-clear-chip">Stage Clear!</span>
        <span class="path-chip">🎁 보물상자</span>
      </div>
      <div class="stamp-grid" id="stamp-board"></div>
      <div style="margin-top:12px; font-family:var(--font-title); color:#5d4037; font-size:1.15rem;" id="stamp-msg">
        미션을 완료하고 도장을 모으세요!
      </div>
    </div>
  </div>

  <!-- Certificate -->
  <div class="modal-overlay" id="cert-modal">
    <div class="popup-box cert-box">
      <div class="cert-title">🏆 역사 박사 임명장</div>
      <div class="cert-name" id="cert-name">위 사람</div>
      <div class="cert-body" id="cert-body">
        한국사 스테이지를 모두 통과했으므로<br/>이 상장을 수여합니다!
      </div>

      <div class="report-card" id="report-text">리포트 생성 중...</div>

      <div class="cert-actions">
        <button class="action-btn btn-copy" onclick="App.copyReport()">리포트 복사</button>
        <button class="action-btn btn-home" onclick="App.goHome()">메인으로</button>
      </div>
    </div>

/* ============================================================================
  [2] App State
============================================================================ */
const App = {
  mode: 'explore',
  stageIdx: 0,
  quizIdx: 0,
  correct: 0,
  wrong: 0,
  startTimeMs: 0,
  timeSpentMs: 0,
  clearedStages: 0,
  layer:{
    territory:true,
    routes:true,
    pins:true,
    labels:true,
  },

  init: () => {
    const slider = document.getElementById("era-slider");
    slider.max = STAGES.length - 1;
    slider.addEventListener("input", (e) => App.setExplore(parseInt(e.target.value,10)));

    // search input
    const si = document.getElementById("search-input");
    si.addEventListener("input", ()=>App.renderSearch(si.value));

    // initial
    App.setExplore(0);
  },

  start: (mode) => {
    App.mode = mode;
    document.getElementById("main-menu").style.transform = "translateY(-100%)";
    document.getElementById("app-screen").style.display = "flex";

    if(mode === 'explore'){
      document.getElementById("ui-explore").style.display = "flex";
      document.getElementById("ui-quiz").style.display = "none";
      document.getElementById("header-txt").innerText = "역사 탐험";
      App.setExplore(parseInt(document.getElementById("era-slider").value,10) || 0);
    }else{
      document.getElementById("ui-explore").style.display = "none";
      document.getElementById("ui-quiz").style.display = "block";
      document.getElementById("header-txt").innerText = "Stage 도전";
      App.startTimeMs = Util.now();
      App.timeSpentMs = 0;
      App.correct = 0;
      App.wrong = 0;
      App.clearedStages = 0;
      App.startStage(0);
    }
  },

  goHome: () => {
    document.getElementById("main-menu").style.transform = "translateY(0)";
    document.getElementById("cert-modal").style.display = "none";
    document.getElementById("stamp-modal").style.display = "none";
    setTimeout(()=>{ document.getElementById("app-screen").style.display = "none"; }, 500);
  },

  setExplore: (idx) => {
    idx = Util.clamp(idx, 0, STAGES.length-1);
    const data = STAGES[idx];
    document.getElementById("era-slider").value = idx;
    document.getElementById("era-badge").innerText = data.title.split(" ")[0] + " " + (data.title.split(" ")[1] || "");
    document.getElementById("year-badge").innerText = Util.fmtYearRange(data.year);

    if(Map.ready) Map.renderStage(data);
    Banana.say(data.guide || `<b>${data.title}</b>야!<br/>핀을 눌러봐 🍌`);
  },

  // ===== Quiz =====
  startStage: (idx) => {
    if(idx >= QUIZZES.length){
      App.finishAll();
      return;
    }
    App.stageIdx = idx;
    App.quizIdx = 0;

    const stageData = STAGES[idx] || STAGES[0];
    if(Map.ready) Map.renderStage(stageData);

    Banana.say(`Stage ${idx+1} 시작!<br/>이번엔 더 똑똑해지자 🍌`);
    App.nextQuiz();
    App.updateQuizMeta();
  },

  nextQuiz: () => {
    const qList = QUIZZES[App.stageIdx] || [];
    if(App.quizIdx >= qList.length){
      App.animateStageClear(App.stageIdx);
      return;
    }
    const q = qList[App.quizIdx];
    document.getElementById("quiz-question").innerText = `Q. ${q.q}`;

    const optsDiv = document.getElementById("quiz-options");
    optsDiv.innerHTML = "";

    if(q.type === 'map'){
      Banana.say("지도에서 정답 핀을 찾아 눌러봐! 📍");
      optsDiv.innerHTML = `<div style="grid-column:span 2; padding:18px; color:#777; font-family:'Nanum Gothic',sans-serif; font-weight:800;">
        👆 지도를 눌러주세요! (정답 핀 클릭)
      </div>`;
    }else{
      q.o.forEach((txt,i)=>{
        const btn = document.createElement("button");
        btn.className = "quiz-btn";
        btn.innerText = txt;
        btn.onclick = ()=>App.check(i === q.a);
        optsDiv.appendChild(btn);
      });
    }

    App.updateQuizMeta();
  },

  updateQuizMeta: () => {
    document.getElementById("quiz-stage-meta").innerText = `Stage ${App.stageIdx+1} / ${QUIZZES.length}`;
    document.getElementById("quiz-score-meta").innerText = `정답 ${App.correct} / 오답 ${App.wrong}`;
  },

  check: (isCorrect) => {
    if(isCorrect){
      App.correct++;
      Banana.say("정답! 😆");
      App.quizIdx++;
      App.updateQuizMeta();
      setTimeout(()=>App.nextQuiz(), 900);
    }else{
      App.wrong++;
      Banana.say("아깝다 ㅠㅠ 😭<br/>다시 생각해봐!");
      App.updateQuizMeta();
    }
  },

  handleMapClick: (pinName) => {
    if(App.mode !== 'quiz') return;
    const q = (QUIZZES[App.stageIdx]||[])[App.quizIdx];
    if(!q || q.type !== 'map') return;

    // 정답 비교: 핀명에 부가 텍스트가 있을 수 있으니 “포함”도 허용
    const ok = (pinName === q.ans) || (pinName.includes(q.ans)) || (q.ans.includes(pinName));
    App.check(ok);
  },

  animateStageClear: (stageIndex) => {
    const modal = document.getElementById("stamp-modal");
    const board = document.getElementById("stamp-board");
    const msg = document.getElementById("stamp-msg");
    const chip = document.getElementById("stage-clear-chip");

    board.innerHTML = "";
    const total = QUIZZES.length;
    for(let i=0;i<total;i++){
      const isStamped = i < stageIndex;
      const div = document.createElement("div");
      div.className = `stamp-slot ${isStamped ? 'stamped':''}`;
      div.innerHTML = `
        <div class="stamp-slot-num">${i+1}</div>
        <div class="stamp-mark">💮</div>
      `;
      if(i === stageIndex){
        div.id = "current-slot";
        div.classList.remove("stamped");
      }
      // 마지막 칸은 보물상자
      if(i === total-1){
        div.innerHTML = `
          <div class="stamp-slot-num">🎁</div>
          <div class="stamp-mark">🧰</div>
        `;
        if(i < stageIndex) div.classList.add("stamped");
        if(i === stageIndex){
          div.id = "current-slot";
          div.classList.remove("stamped");
        }
      }
      board.appendChild(div);
    }

    modal.style.display = "flex";
    chip.innerText = `Stage ${stageIndex+1} Clear!`;

    msg.innerText = `Stage ${stageIndex+1} 클리어! 도장 쾅!`;

    setTimeout(()=>{
      const slot = document.getElementById("current-slot");
      if(slot) slot.classList.add("stamped");
    }, 450);

    setTimeout(()=>{
      modal.style.display = "none";
      App.clearedStages = stageIndex + 1;
      App.startStage(stageIndex + 1);
    }, 1700);
  },

  finishAll: () => {
    App.timeSpentMs = Util.now() - App.startTimeMs;
    App.showCertificate();
  },

  showCertificate: () => {
    const modal = document.getElementById("cert-modal");
    const report = App.buildReportText();
    document.getElementById("cert-name").innerHTML = `<b>위 사람</b>은(는)`;
    document.getElementById("report-text").innerText = report;
    modal.style.display = "flex";
    Banana.say("와… 진짜 다 깼다!<br/>이제 너는 역사 박사! 🍌🏆");
  },

  buildReportText: () => {
    const totalQ = QUIZZES.flat().length;
    const acc = totalQ ? Math.round((App.correct/totalQ)*100) : 0;
    const sec = Math.round(App.timeSpentMs/1000);
    const mm = Math.floor(sec/60);
    const ss = sec%60;

    // 스테이지별 간단 요약
    const stageTitles = QUIZZES.map((_,i)=>`Stage ${i+1}: ${STAGES[i]?.title || "스테이지"}`).join("\n");

    // 추천 복습 포인트(오답 기반 간단)
    const review = [];
    if(App.wrong >= 5) review.push("• 오답이 많았던 편이야 → ‘지도 클릭형(핵심 지명)’부터 다시!");
    if(App.wrong === 0) review.push("• 완벽 클리어! → 이제 난이도 상(서술형/사료형)로 확장 가능!");
    review.push("• 추천 복습 루트: 지명(핀) → 경로(선) → 개념(말풍선 QnA)");

    return [
      "📌 [학습 리포트 - 도전! 바나나 히스토리]",
      `- 총 문제: ${totalQ}`,
      `- 정답/오답: ${App.correct} / ${App.wrong}`,
      `- 정답률: ${acc}%`,
      `- 소요 시간: ${mm}분 ${ss}초`,
      "",
      "🗺️ [스테이지 목록]",
      stageTitles,
      "",
      "✅ [복습 추천]",
      review.join("\n"),
      "",
      "🍌 나노바나나 드림"
    ].join("\n");
  },

  copyReport: async () => {
    const txt = document.getElementById("report-text").innerText;
    try{
      await navigator.clipboard.writeText(txt);
      Banana.say("리포트 복사 완료! 📋🍌");
    }catch(e){
      alert("복사에 실패했어. (기기 설정/브라우저 제한일 수 있어요)");
    }
  },

  // ===== QnA =====
  openQna: () => {
    const idx = parseInt(document.getElementById("era-slider").value,10) || 0;
    const data = STAGES[idx];
    const list = document.getElementById("qna-list");
    list.innerHTML = "";

    const block = (q,d)=>`
      <div style="margin-bottom:10px;">
        <div style="font-family:var(--font-title); font-size:1.15rem; color:#0d47a1;">❓ ${q}</div>
        <div style="padding:10px; background:#fff9c4; border-radius:10px; margin-top:6px; border:2px solid rgba(0,0,0,.08); font-family:'Nanum Gothic',sans-serif; font-weight:800; color:#37474f;">
          ${d}
        </div>
      </div>
    `;

    if(!data.qna || !data.qna.length){
      list.innerHTML = "<p style='text-align:center; font-family:var(--font-title);'>질문이 아직 없어! 🍌</p>";
    }else{
      // ✅ “내용 보강”: 기본 QnA + “교과서 포인트” 자동 추가
      const auto = [
        {q:"이 시대 지도에서 꼭 봐야 할 3요소는?", d:"① 핵심 지명(수도/전투/거점) ② 이동 경로(진격·침입·교류) ③ 왜 그 지리가 중요한가(강·바다·관문)"},
        {q:"시험에 자주 나오는 지도형 포인트는?", d:"‘왜 거기냐’(지리적 이유) + ‘결과가 뭐냐’(정치·경제·전쟁 영향)로 연결하기"},
      ];
      const merged = [...data.qna, ...auto];
      merged.forEach(x=> list.insertAdjacentHTML("beforeend", block(x.q, x.d)));
    }

    document.getElementById("qna-modal").style.display = "flex";
  },
  closeQna: ()=> document.getElementById("qna-modal").style.display = "none",

  // ===== Search =====
  openSearch: () => {
    document.getElementById("search-modal").style.display = "flex";
    const si = document.getElementById("search-input");
    si.value = "";
    si.focus();
    App.renderSearch("");
  },
  closeSearch: ()=> document.getElementById("search-modal").style.display = "none",

  renderSearch: (query) => {
    const q = Util.normalize(query);
    const results = [];

    // collect all pins across stages
    STAGES.forEach((st, idx)=>{
      (st.pins||[]).forEach(p=>{
        results.push({
          type:"pin",
          key:p.name,
          stageIdx: idx,
          label:`${p.name} · ${st.title}`,
          at:p.at
        });
      });
      (st.routes||[]).forEach(r=>{
        results.push({
          type:"route",
          key:r.label,
          stageIdx: idx,
          label:`${r.label} · ${st.title}`,
          at:r.to
        });
      });
      (st.qna||[]).forEach(qa=>{
        results.push({
          type:"qna",
          key:qa.q,
          stageIdx: idx,
          label:`${qa.q} · ${st.title}`,
          at:null
        });
      });
    });

    const filtered = q
      ? results.filter(x=> Util.normalize(x.label).includes(q) || Util.normalize(x.key).includes(q))
      : results.slice(0, 18);

    const box = document.getElementById("search-results");
    box.innerHTML = "";

    if(!filtered.length){
      box.innerHTML = `<div style="padding:10px; font-family:var(--font-title); text-align:center; color:#666;">검색 결과가 없어 🍌</div>`;
      return;
    }

    filtered.slice(0, 30).forEach(item=>{
      const btn = document.createElement("button");
      btn.className = "quiz-btn";
      btn.style.textAlign = "left";
      btn.style.borderColor = "rgba(0,0,0,.15)";
      btn.innerText = item.label;
      btn.onclick = ()=>{
        App.closeSearch();
        App.mode = 'explore';
        document.getElementById("ui-explore").style.display = "flex";
        document.getElementById("ui-quiz").style.display = "none";
        document.getElementById("header-txt").innerText = "역사 탐험";
        App.setExplore(item.stageIdx);

        // focus/highlight
        if(item.at && Map.ready){
          Map.flyToLonLat(item.at, 2.2);
          Map.flashAtLonLat(item.at);
        }else{
          Banana.say("이 항목은 위치가 아니라 ‘개념’이야!<br/>❓ 버튼에서 확인해봐 🍌");
          App.openQna();
        }
      };
      box.appendChild(btn);
    });
  },

  // ===== Layer =====
  openLayer: () => {
    document.getElementById("layer-modal").style.display = "flex";
    document.getElementById("layer-territory").checked = App.layer.territory;
    document.getElementById("layer-routes").checked = App.layer.routes;
    document.getElementById("layer-pins").checked = App.layer.pins;
    document.getElementById("layer-labels").checked = App.layer.labels;
  },
  closeLayer: ()=> document.getElementById("layer-modal").style.display = "none",
  applyLayer: () => {
    App.layer.territory = document.getElementById("layer-territory").checked;
    App.layer.routes = document.getElementById("layer-routes").checked;
    App.layer.pins = document.getElementById("layer-pins").checked;
    App.layer.labels = document.getElementById("layer-labels").checked;
    App.closeLayer();
    App.setExplore(parseInt(document.getElementById("era-slider").value,10) || 0);
    Banana.say("레이어 적용 완료! 🗺️🍌");
  }
};

/* ============================================================================
  [3] Banana guide
============================================================================ */
const Banana = {
  say: (html) => {
    const b = document.getElementById("banana-msg");
    b.innerHTML = html;
    b.classList.remove("show");
    void b.offsetWidth;
    b.classList.add("show");
  }
};

/* ============================================================================
  [4] Map (D3)
  - ✅ 화면 반 잘림/하늘색 여백 문제 해결: SVG를 container에 “fit”
  - ✅ 글씨 겹침 문제 완화: 핀 라벨은 기본 숨기고(또는 자동 오프셋), 클릭 시 강조
============================================================================ */
const Map = {
  svg:null, g:null, proj:null, path:null, ready:false, zoom:null,
  width:800, height:600,
  currentTransform: d3.zoomIdentity,

  init: () => {
    Map.svg = d3.select("#map-svg");
    Map.svg.attr("preserveAspectRatio", "xMidYMid meet");
    Map.g = Map.svg.append("g");

    Map.g.append("g").attr("id","l-land");
    Map.g.append("g").attr("id","l-territory");
    Map.g.append("g").attr("id","l-territory2");
    Map.g.append("g").attr("id","l-river");
    Map.g.append("g").attr("id","l-route");
    Map.g.append("g").attr("id","l-pin");
    Map.g.append("g").attr("id","l-label");
    Map.g.append("g").attr("id","l-highlight");

    Map.zoom = d3.zoom()
      .scaleExtent([1, 10])
      .on("zoom", (e)=>{
        Map.currentTransform = e.transform;
        Map.g.attr("transform", e.transform);
      });

    Map.svg.call(Map.zoom);

    Map.resize();
    window.addEventListener("resize", ()=>Map.resize());

    // Base map
    d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/land-50m.json").then(data=>{
      document.getElementById("loading-msg").style.display = "none";
      const land = topojson.feature(data, data.objects.land);

      // Projection: 한반도 중심 fit
      Map.proj = d3.geoMercator();
      Map.path = d3.geoPath().projection(Map.proj);

      // Fit to Korea-ish bbox
      const bbox = {type:"Feature", geometry:{type:"Polygon", coordinates:[[
        [118, 46],[135,46],[135,32],[118,32],[118,46]
      ]]}};
      Map.fitToFeature(bbox);

      d3.select("#l-land")
        .append("path")
        .datum(land)
        .attr("d", Map.path)
        .attr("fill", "#fffde7")
        .attr("stroke", "#e0e0e0");

      // Rivers (대표)
      Map.drawRivers();

      Map.ready = true;
      App.setExplore(0);
    });
  },

  resize: () => {
    const el = document.getElementById("map-container");
    const rect = el.getBoundingClientRect();
    Map.width = Math.max(320, rect.width);
    Map.height = Math.max(320, rect.height);

    Map.svg
      .attr("viewBox", `0 0 ${Map.width} ${Map.height}`)
      .attr("width", Map.width)
      .attr("height", Map.height);

    if(Map.proj){
      // projection is defined: keep current center/scale as-is
    }
  },

  fitToFeature: (feature) => {
    // Fit projection to given feature
    const pad = 30;
    const tmpPath = d3.geoPath().projection(Map.proj);
    const b = tmpPath.bounds(feature);
    const dx = b[1][0]-b[0][0];
    const dy = b[1][1]-b[0][1];
    const x = (b[0][0]+b[1][0])/2;
    const y = (b[0][1]+b[1][1])/2;

    const scale = 0.95 / Math.max(dx/(Map.width-pad*2), dy/(Map.height-pad*2));
    const translate = [Map.width/2 - scale*x, Map.height/2 - scale*y];
    Map.proj.scale(scale).translate(translate);
  },

  drawRivers: () => {
    const rivers = [
      {n:"압록강", p:[[124.2,41.7],[125.6,41.3],[127.0,41.4]]},
      {n:"대동강", p:[[125.1,39.4],[125.7,39.1],[126.2,39.0]]},
      {n:"한강", p:[[126.6,37.7],[127.2,37.5],[128.0,37.3]]},
      {n:"금강", p:[[126.5,36.0],[127.2,36.3],[127.5,36.0]]},
      {n:"낙동강", p:[[128.9,35.1],[128.5,35.8],[129.0,36.5]]},
    ];
    const lineGen = d3.line()
      .x(d=>Map.proj(d)[0])
      .y(d=>Map.proj(d)[1])
      .curve(d3.curveBasis);

    const lR = d3.select("#l-river");
    lR.selectAll("*").remove();

    rivers.forEach(r=>{
      lR.append("path")
        .attr("d", lineGen(r.p))
        .attr("class","river-path");
      const t = Map.proj(r.p[1]);
      lR.append("text")
        .attr("x", t[0]).attr("y", t[1])
        .attr("class","route-label")
        .text(r.n);
    });
  },

  renderStage: (stage) => {
    if(!Map.ready) return;

    // layers
    const lTerr = d3.select("#l-territory"); lTerr.selectAll("*").remove();
    const lTerr2 = d3.select("#l-territory2"); lTerr2.selectAll("*").remove();
    const lRoute = d3.select("#l-route"); lRoute.selectAll("*").remove();
    const lPin = d3.select("#l-pin"); lPin.selectAll("*").remove();
    const lLabel = d3.select("#l-label"); lLabel.selectAll("*").remove();
    d3.select("#l-highlight").selectAll("*").remove();

    // Fit view to stage bbox if wide (e.g., 동아시아/상하이)
    Map.fitToStage(stage);

    // Territory polygons
    if(App.layer.territory){
      (stage.map||[]).forEach(m=>{
        Map.drawPolygon(lTerr, m.poly, m.fill, m.name);
      });
      // extras (도 단위 등)
      (stage.mapExtras||[]).forEach(m=>{
        Map.drawPolygon(lTerr2, m.poly, m.fill, `${m.name} (${m.hint||""})`, 0.65, true);
      });
    }

    // Labels (국가명) - ✅ 겹침 최소화: 중앙에만
    if(App.layer.labels){
      (stage.map||[]).forEach(m=>{
        const c = Map.polyCentroid(m.poly);
        const xy = Map.proj(c);
        lLabel.append("text")
          .attr("x",xy[0]).attr("y",xy[1])
          .attr("class","label-txt")
          .text(m.name);
      });
    }

    // Routes
    if(App.layer.routes && stage.routes){
      stage.routes.forEach(r=>{
        Map.drawRoute(lRoute, r.from, r.to, r.color || "#1e88e5", r.label);
      });
    }

    // Pins
    if(App.layer.pins && stage.pins){
      Map.drawPins(lPin, stage.pins);
    }
  },

  fitToStage: (stage) => {
    // create a bbox polygon from stage polygons + pins
    let lonMin=999, lonMax=-999, latMin=999, latMax=-999;

    const add = (pt)=>{
      const [lon,lat]=pt;
      lonMin=Math.min(lonMin,lon); lonMax=Math.max(lonMax,lon);
      latMin=Math.min(latMin,lat); latMax=Math.max(latMax,lat);
    };

    (stage.map||[]).forEach(m=>m.poly.forEach(add));
    (stage.mapExtras||[]).forEach(m=>m.poly.forEach(add));
    (stage.pins||[]).forEach(p=>add(p.at));
    (stage.routes||[]).forEach(r=>{ add(r.from); add(r.to); });

    // fallback
    if(lonMin>lonMax){
      lonMin=118; lonMax=135; latMin=32; latMax=46;
    }

    // padding
    lonMin-=1.2; lonMax+=1.2;
    latMin-=1.0; latMax+=1.0;

    const bbox = {type:"Feature", geometry:{type:"Polygon", coordinates:[[
      [lonMin,latMax],[lonMax,latMax],[lonMax,latMin],[lonMin,latMin],[lonMin,latMax]
    ]]}};

    Map.fitToFeature(bbox);

    // reset zoom transform to identity for clarity when switching stage
    Map.svg.transition().duration(350).call(Map.zoom.transform, d3.zoomIdentity);
  },

  drawPolygon: (layer, poly, fill, name, opacity=0.85, dashed=false) => {
    const line = d3.line()
      .x(d=>Map.proj(d)[0])
      .y(d=>Map.proj(d)[1])
      .curve(d3.curveBasisClosed);

    layer.append("path")
      .attr("d", line(poly))
      .attr("fill", fill)
      .attr("stroke", dashed ? "#5d4037" : "white")
      .attr("stroke-width", dashed ? 2.2 : 2)
      .attr("stroke-dasharray", dashed ? "6 6" : null)
      .attr("opacity", opacity)
      .on("click", ()=>Banana.say(`<b>${name}</b><br/>지도를 눌러 영역을 확인했어! 🍌`));
  },

  polyCentroid: (poly) => {
    const lon = d3.mean(poly, p=>p[0]);
    const lat = d3.mean(poly, p=>p[1]);
    return [lon,lat];
  },

  drawRoute: (layer, from, to, color, label) => {
    const p1 = Map.proj(from);
    const p2 = Map.proj(to);
    const midX = (p1[0]+p2[0])/2;
    const midY = (p1[1]+p2[1])/2;
    const ctrl = [midX + (p2[1]-p1[1])*0.18, midY + (p1[0]-p2[0])*0.18];

    const d = `M ${p1[0]},${p1[1]} Q ${ctrl[0]},${ctrl[1]} ${p2[0]},${p2[1]}`;

    layer.append("path")
      .attr("d", d)
      .attr("class","route-path")
      .attr("stroke", color)
      .attr("fill","none")
      .attr("marker-end", "url(#arrow)");

    // label near control
    layer.append("text")
      .attr("x", ctrl[0]).attr("y", ctrl[1])
      .attr("class","route-label")
      .text(label || "");
  },

  drawPins: (layer, pins) => {
    // ✅ 글씨 겹침 해결: 라벨 자동 오프셋(가까운 것끼리 y를 다르게)
    const placed = [];

    pins.forEach((p, idx)=>{
      const xy = Map.proj(p.at);
      let dy = -28;
      // if too close to previous labels, push up/down alternately
      for(const o of placed){
        if(Util.distance([xy[0],xy[1]],[o.x,o.y]) < 42){
          dy -= 16;
        }
      }
      placed.push({x:xy[0], y:xy[1]});

      const g = layer.append("g")
        .attr("transform",`translate(${xy[0]},${xy[1]})`)
        .style("cursor","pointer")
        .on("click",(e)=>{
          e.stopPropagation();
          Map.flashAtLonLat(p.at);

          if(App.mode === 'quiz'){
            App.handleMapClick(p.name);
          }else{
            Banana.say(`<b>${p.name}</b><br/>${p.desc || ""}`);
          }
        });

      // pin circle
      const bg = (p.icon==="💥") ? "#d32f2f" : (p.icon==="📣") ? "#6a1b9a" : "#fbc02d";

      g.append("circle")
        .attr("r", 18)
        .attr("fill", bg)
        .attr("stroke","white")
        .attr("stroke-width",3);

      g.append("text")
        .attr("text-anchor","middle")
        .attr("dy", 6)
        .attr("font-size","17px")
        .text(p.icon || "📍");

      // label
      g.append("text")
        .attr("class","pin-label")
        .attr("text-anchor","middle")
        .attr("y", dy)
        .text(p.name);
    });

    // marker defs once
    if(Map.svg.select("defs").empty()){
      const defs = Map.svg.append("defs");
      defs.append("marker")
        .attr("id","arrow")
        .attr("viewBox","0 -5 10 10")
        .attr("refX",10)
        .attr("refY",0)
        .attr("markerWidth",7)
        .attr("markerHeight",7)
        .attr("orient","auto")
        .append("path")
        .attr("d","M0,-5L10,0L0,5")
        .attr("fill","#263238");
    }
  },

  flyToLonLat: (lonlat, scale=2.0) => {
    const [x,y] = Map.proj(lonlat);
    const t = d3.zoomIdentity
      .translate(Map.width/2 - x*scale, Map.height/2 - y*scale)
      .scale(scale);
    Map.svg.transition().duration(450).call(Map.zoom.transform, t);
  },

  flashAtLonLat: (lonlat) => {
    const layer = d3.select("#l-highlight");
    layer.selectAll("*").remove();
    const [x,y] = Map.proj(lonlat);

    const c = layer.append("circle")
      .attr("cx",x).attr("cy",y)
      .attr("r", 10)
      .attr("class","highlight-ring")
      .attr("opacity", 0.95);

    c.transition().duration(450).attr("r", 40).attr("opacity", 0.0).remove();
  }
};

window.onload = () => {
  App.init();
  Map.init();
};
</script>
